<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Space Club</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=block" rel="stylesheet">
<script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
} }
</script>
<style>
  html, body { margin:0; height:100%; background:#05030a; overflow:hidden; }
  canvas#stage { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #ed { position:fixed; left:0; top:0; width:600px; height:300px; opacity:0; pointer-events:none; z-index:-1; }
  canvas#stage { z-index:1; }
  #go { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(5,3,10,.72); z-index:5; }
  #go button { font:700 20px ui-monospace, Menlo, monospace; letter-spacing:.08em; color:#140a10; background:#ff4fb0; border:0;
    border-radius:8px; padding:16px 28px; cursor:pointer; box-shadow:0 0 28px rgba(255,79,176,.6); }
  #mute { position:fixed; top:14px; right:16px; z-index:6; min-height:44px; padding:0 16px; font:700 14px ui-monospace, Menlo, monospace; letter-spacing:.06em;
    color:#ffe9f5; background:rgba(12,6,20,.72); border:1px solid #ff4fb0; border-radius:8px; cursor:pointer; }
  #mute[aria-pressed="true"] { color:#9fb0c8; border-color:#4a5a78; }
  #mute:focus-visible { outline:2px solid #3ef0ff; outline-offset:2px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<button id="mute" type="button" aria-pressed="false">SOUND ON</button>
<div id="go"><button id="start">START THE SET</button></div>
<strudel-editor id="ed"><!--
// loading
--></strudel-editor>

<script type="module">
// the neon signs use Yellowtail (open licence, Google Fonts): the Mac-only script fonts were missing on the Forge, which drew the signs in a plain serif
try { await Promise.race([document.fonts.load('100px Yellowtail'), new Promise((r) => setTimeout(r, 5000))]); } catch {}
// The club: a Three.js stage driven by the set's own clock (bars), so every light, bounce and cut lands on the music.
// ?bar=60 previews a position without audio (also the hook for rendering frames later: window.club.setBar(x)).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const TRACK = '/patterns/10-cyber-space-set.strudel.js', BARS = 96;
// [first bar, name, energy 0..1, kick: 0 none / 1 four-on-the-floor / 2 half-time]
const SECTIONS = [                                   // 96 bars, about 3:03 (Joona: "end it around 3 minutes")
  [0, 'announce', .55, 0], [12, 'introB', .3, 0], [20, 'build', .55, 1], [28, 'A', .7, 1], [36, 'break', .35, 0],
  [44, 'drop', 1, 1], [60, 'B', .75, 1], [68, 'bridge', .45, 2], [76, 'final', 1, 1], [92, 'outroA', .35, 1]];
const sectionAt = (bar) => { let s = SECTIONS[0]; for (const x of SECTIONS) if (bar >= x[0]) s = x; return s; };
const PINK = 0xff4fb0, CYAN = 0x3ef0ff, ORANGE = 0xe8622c;
const rand = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };   // fixed per index

// ---------- renderer ----------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05030a); scene.fog = new THREE.Fog(0x05030a, 6, 16);
const camera = new THREE.PerspectiveCamera(38, 1, .1, 60);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .5, .45, .93); composer.addPass(bloom);
composer.addPass(new OutputPass());
let offline = false;                                 // video render: the page's own loop stops and frames are taken on demand
function resize() { if (offline) return; const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- room ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x0b0714, roughness: .35, metalness: .6 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
// back wall screen: the glyph grid from the live page, as a texture
const gc = document.createElement('canvas'); gc.width = 768; gc.height = 320; const gx = gc.getContext('2d');
const gtex = new THREE.CanvasTexture(gc); gtex.colorSpace = THREE.SRGBColorSpace;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), new THREE.MeshBasicMaterial({ map: gtex }));
screen.position.set(0, 2.9, -6.5); scene.add(screen);
const GLYPHS = '.:-=+*#%@░▒▓█▚▞◢◣◤◥アカサタナハマヤラワ01';
function drawGlyphs(bar, pulse, energy) {
  const W = gc.width, H = gc.height, CELL = 16, s = bar * 1.9;
  const g = gx.createLinearGradient(0, 0, W, H); const hue = 300 + 40 * Math.sin(s * .07);
  g.addColorStop(0, `hsl(${hue},85%,${8 + 10 * pulse * energy}%)`); g.addColorStop(1, `hsl(190,90%,${7 + 8 * pulse * energy}%)`);
  gx.fillStyle = g; gx.fillRect(0, 0, W, H);
  gx.font = `${CELL - 3}px ui-monospace, Menlo, monospace`; gx.textBaseline = 'top';
  const rows = H / CELL, cols = W / CELL, scan = (bar % 1) * rows;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const n = Math.sin(x * .31 + s * .9) + Math.cos(y * .27 - s * .7) + Math.sin((x + y) * .11 + s * .3);
    const v = (n + 3) / 6, near = Math.max(0, 1 - Math.abs(y - scan) / 3);
    const a = .06 + (.3 + .5 * energy) * v * v + .5 * near * pulse;
    if (a < .1) continue;
    gx.fillStyle = (x + y) % 7 === 0 ? `rgba(62,240,255,${a})` : `rgba(255,79,176,${a})`;
    gx.fillText(GLYPHS[Math.floor(v * (GLYPHS.length - 1) + s * 2 + x) % GLYPHS.length], x * CELL, y * CELL);
  }
  gtex.needsUpdate = true;
}
// neon tubes
const tube = (color, x, y, z, len, rotZ = 0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(len, .05, .05), new THREE.MeshBasicMaterial({ color })); m.position.set(x, y, z); m.rotation.z = rotZ; scene.add(m); return m; };
const tubes = [tube(PINK, -6.2, 2.6, -3, 5, Math.PI / 2), tube(CYAN, 6.2, 2.6, -3, 5, Math.PI / 2), tube(PINK, 0, 5.5, -6.3, 12), tube(CYAN, 0, .25, -6.3, 12)];

// ---------- neon: "CLAUDE LOVES ART" (Joona, 2026-11-19), drawn as glowing tube lettering; each sign also lights the room ----------
const YELLOW = 0xffe14f, GREEN = 0x6bff9e, VIOLET = 0xb46bff;
const hex = (c) => '#' + c.toString(16).padStart(6, '0');
function neonCanvas(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  x.lineCap = x.lineJoin = 'round'; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const [blur, alpha, core] of [[38, .55, false], [16, .9, false], [0, 1, true]]) { x.shadowBlur = blur; x.globalAlpha = alpha; draw(x, core); }   // halo, glow, white-hot core
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const neonText = (x, text, cx, cy, size, color, core) => {
  x.font = `${size}px Yellowtail, "Brush Script MT", "Snell Roundhand", cursive`;
  x.shadowColor = color; x.strokeStyle = core ? '#fff7fb' : color; x.lineWidth = core ? size * .035 : size * .09; x.strokeText(text, cx, cy);
};
const signs = [];
function addSign(tex, w, h, x, y, z, lightColor, ry = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m);
  const l = new THREE.PointLight(lightColor, 0, 9, 1.6); l.position.set(x, y, z + .7); scene.add(l);
  signs.push({ m, l, i: signs.length }); return m;
}
// back wall, left: the words in two colours
addSign(neonCanvas(1024, 512, (x, core) => { neonText(x, 'Claude', 512, 150, 190, hex(CYAN), core); neonText(x, 'loves art', 512, 360, 170, hex(PINK), core); }), 4.2, 2.1, -3.3, 3.25, -6.35, CYAN);
// back wall, right: a heart with the starburst inside it, and a paintbrush stroke under it
addSign(neonCanvas(768, 768, (x, core) => {
  x.shadowColor = hex(PINK); x.strokeStyle = core ? '#fff7fb' : hex(PINK); x.lineWidth = core ? 7 : 20;
  x.beginPath(); x.moveTo(384, 610); x.bezierCurveTo(60, 400, 130, 120, 384, 250); x.bezierCurveTo(638, 120, 708, 400, 384, 610); x.stroke();
  x.shadowColor = hex(YELLOW); x.strokeStyle = core ? '#fffdf0' : hex(YELLOW); x.lineWidth = core ? 5 : 14;
  for (let j = 0; j < 12; j++) { const a = j / 12 * Math.PI * 2 + .13, r = j % 2 ? 62 : 84; x.beginPath(); x.moveTo(384 + Math.cos(a) * 20, 400 + Math.sin(a) * 20); x.lineTo(384 + Math.cos(a) * r, 400 + Math.sin(a) * r); x.stroke(); }
  x.shadowColor = hex(GREEN); x.strokeStyle = core ? '#f4fff8' : hex(GREEN); x.lineWidth = core ? 6 : 16;
  x.beginPath(); x.moveTo(150, 700); x.bezierCurveTo(300, 650, 470, 740, 620, 690); x.stroke();
}), 2.7, 2.7, 3.4, 3.2, -6.35, PINK);
// centre top: the house name
addSign(neonCanvas(1280, 400, (x, core) => { neonText(x, 'LoveSpark', 640, 200, 230, hex(VIOLET), core); }), 4.6, 1.44, 0, 4.45, -6.35, VIOLET);
// the DJ's name, either side of her head: shown only in channel-art stills
const nameSigns = [['Bvby', -.86, CYAN], ['Ash', .84, PINK]].map(([word, x, col]) => {
  const m = addSign(neonCanvas(640, 360, (c, core) => neonText(c, word, 320, 180, 250, hex(col), core)), 1.05, .59, x, 1.6, -.5, col); m.visible = false; m.userData.isName = true; m.renderOrder = 3;
  const board = new THREE.Mesh(new THREE.PlaneGeometry(1.0, .5), new THREE.MeshBasicMaterial({ color: 0x07040d, transparent: true, opacity: .86 })); board.position.z = -.02; board.renderOrder = 2; m.add(board);   // a dark board so the tubes read against the crowd
  return m; });
// high and small, either side: single words in other colours
addSign(neonCanvas(512, 256, (x, core) => neonText(x, 'art', 256, 128, 190, hex(YELLOW), core)), 1.6, .8, -5.6, 2.2, -4.6, YELLOW, .9);
addSign(neonCanvas(512, 256, (x, core) => neonText(x, 'love', 256, 128, 170, hex(VIOLET), core)), 1.6, .8, 5.6, 2.2, -4.6, VIOLET, -.9);
// underglow: light spilling onto the floor from beneath the booth, the speaker stacks and the podiums
const glows = [[0, .12, 1.45, PINK, 2.2], [-1.9, .12, .9, CYAN, 3], [1.9, .12, .9, VIOLET, 3], [-1.3, .12, -.4, GREEN, 2.5], [1.3, .12, -.4, YELLOW, 2.5]].map(([x, y, z, c, k]) => {
  // range 1.4 m: they light the floor, not Ash. With 5 m (and no shadows) they shone through the booth onto her suit when she leant
  // over the mixer, and the drop's bloom turned it into a white glow (video v1, 122.9-128.7 s and 210.5-214.8 s).
  const l = new THREE.PointLight(c, 0, 1.4, 1.5); l.position.set(x, y, z); scene.add(l);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(k > 4 ? 2.5 : .75, .03, .03), new THREE.MeshBasicMaterial({ color: c })); bar.position.set(x, .03, z - .12); scene.add(bar);
  return { l, k, bar, c };
});

// ---------- a mirror ball over the floor (Joona, 2026-11-19: "disco ball as well") ----------
// Tiles are lit by where they face: each glints when it turns toward the camera through a light. Its reflected ballSpots sweep
// the back wall and floor, one turn every 8 bars; they grow brighter with the music's energy.
const ball = new THREE.Group(); ball.position.set(0, 2.72, -2.3); scene.add(ball);
const BALL_R = .26, tiles = [];
for (let i = 0; i < 18; i++) { const lat = -Math.PI / 2 + (i + .5) / 18 * Math.PI, n = Math.max(6, Math.round(36 * Math.cos(lat)));
  for (let j = 0; j < n; j++) tiles.push([lat, (j + (i % 2) * .5) / n * Math.PI * 2]); }
const tileMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(BALL_R * .155, BALL_R * .155), new THREE.MeshBasicMaterial({ toneMapped: false }), tiles.length);
const tileN = tiles.map(([lat, lon]) => new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon)));
const _tileObj = new THREE.Object3D();   // (the shared `dummy` is defined further down)
tileN.forEach((n, i) => { const dummy = _tileObj; dummy.position.copy(n).multiplyScalar(BALL_R); dummy.lookAt(n.clone().multiplyScalar(2)); dummy.scale.setScalar(1); dummy.updateMatrix(); tileMesh.setMatrixAt(i, dummy.matrix); tileMesh.setColorAt(i, new THREE.Color(.3, .3, .32)); });
ball.add(tileMesh, new THREE.Mesh(new THREE.SphereGeometry(BALL_R * .97, 24, 16), new THREE.MeshBasicMaterial({ color: 0x0c0b10 })));
const cable = new THREE.Mesh(new THREE.CylinderGeometry(.006, .006, 3, 6), new THREE.MeshBasicMaterial({ color: 0x15131a })); cable.position.set(0, 2.72 + BALL_R + 1.5, -2.3); scene.add(cable);
const spotTex = canvasTexEarly(64, (g) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(255,255,255,.7)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); });
function canvasTexEarly(n, draw) { const c = document.createElement('canvas'); c.width = c.height = n; draw(c.getContext('2d')); return new THREE.CanvasTexture(c); }
const SPOTS = 120, spotDir = [], spotTint = [PINK, CYAN, 0xffffff, 0xffffff, 0xffe14f];
for (let i = 0; i < SPOTS; i++) { const u = rand(i * 3 + 400) * 2 - 1, t = rand(i * 3 + 401) * Math.PI * 2; spotDir.push(new THREE.Vector3(Math.sqrt(1 - u * u) * Math.cos(t), u * .8 - .1, Math.sqrt(1 - u * u) * Math.sin(t)).normalize()); }
const ballSpots = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: spotTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }), SPOTS);
spotDir.forEach((d, i) => ballSpots.setColorAt(i, new THREE.Color(spotTint[i % spotTint.length])));
scene.add(ballSpots);
const _sd = new THREE.Vector3(), _cv = new THREE.Vector3(), _rf = new THREE.Vector3(), _key = new THREE.Vector3(-.3, .9, .3).normalize(), _tc = new THREE.Color();
function poseBall(bar, energy, pulse) {
  const yaw = bar / 8 * Math.PI * 2, bright = .25 + .75 * energy;
  ball.rotation.y = yaw;
  _cv.copy(camera.position).sub(ball.position).normalize();
  for (let i = 0; i < tiles.length; i++) {                    // a glint when the tile's mirror angle lines the camera up with the light above
    _rf.copy(tileN[i]).applyAxisAngle(_Y, yaw);
    const half = _sd.copy(_cv).add(_key).normalize(), g = Math.pow(Math.max(0, _rf.dot(half)), 90);
    const v = .22 + .1 * ((i * 7) % 5) / 5 + 3.5 * g * bright;
    tileMesh.setColorAt(i, _tc.setRGB(v, v, v * 1.05));
  }
  tileMesh.instanceColor.needsUpdate = true;
  let k = 0;
  for (let i = 0; i < SPOTS; i++) {
    _sd.copy(spotDir[i]).applyAxisAngle(_Y, yaw);
    const P = ball.position; let t = Infinity, nrm = null;
    if (_sd.z < -.05) { const tz = (-6.44 - P.z) / _sd.z, y = P.y + _sd.y * tz, x = P.x + _sd.x * tz; if (y > .2 && y < 5.4 && Math.abs(x) < 6) { t = tz; nrm = 'wall'; } }
    if (_sd.y < -.05) { const ty = (.012 - P.y) / _sd.y; if (ty < t) { const x = P.x + _sd.x * ty, z = P.z + _sd.z * ty; if (Math.abs(x) < 6 && z < 1.4 && z > -6.4) { t = ty; nrm = 'floor'; } } }
    if (!nrm) continue;
    dummy.position.copy(P).addScaledVector(_sd, t);
    dummy.rotation.set(nrm === 'floor' ? -Math.PI / 2 : 0, 0, 0);
    const size = (.05 + .025 * t / 4) * (1 + .15 * pulse);
    dummy.scale.set(size, size * (nrm === 'floor' ? 1.4 : 1.1), 1); dummy.updateMatrix(); ballSpots.setMatrixAt(k, dummy.matrix);
    ballSpots.setColorAt(k, _tc.setHex(spotTint[i % spotTint.length]).multiplyScalar(bright * (.7 + .3 * pulse))); k++;
  }
  ballSpots.count = k; ballSpots.instanceMatrix.needsUpdate = true; ballSpots.instanceColor.needsUpdate = true;
}

// ---------- the booth ----------
const dark = new THREE.MeshStandardMaterial({ color: 0x15101f, roughness: .5, metalness: .4 });
const booth = new THREE.Group(); scene.add(booth); booth.position.set(0, 0, .75);
const table = new THREE.Mesh(new THREE.BoxGeometry(2.6, .98, .75), dark); table.position.y = .49; booth.add(table);
const front = new THREE.Mesh(new THREE.PlaneGeometry(2.5, .8), new THREE.MeshBasicMaterial({ map: gtex, color: 0x555566 })); front.position.set(0, .47, .378); booth.add(front);   // LED front panel
const boothSign = new THREE.Mesh(new THREE.PlaneGeometry(2.3, .62), new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  map: neonCanvas(1400, 380, (x, core) => neonText(x, 'Claude loves art', 700, 190, 168, hex(PINK), core)) })); boothSign.position.set(0, .47, .386); booth.add(boothSign);
const strip = new THREE.Mesh(new THREE.BoxGeometry(2.6, .04, .02), new THREE.MeshBasicMaterial({ color: PINK })); strip.position.set(0, .93, .385); booth.add(strip);
// two turntables and a mixer, built in detail (Joona, 2026-11-19: "more detail on the turntable"): an aluminium platter with
// strobe dots, a record with grooves and a LoveSpark label, a tonearm on its base with headshell and counterweight, pitch
// fader, start/stop and 33/45 buttons, target light; the mixer gets EQ knobs, channel faders and a crossfader that move
const platters = [], deckBits = { faders: [], xfader: null, targets: [] };
const brushed = new THREE.MeshStandardMaterial({ color: 0x8d8a9a, roughness: .32, metalness: .9 });
const blackGloss = new THREE.MeshStandardMaterial({ color: 0x0b0a10, roughness: .3, metalness: .5 });
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }
const vinylTex = canvasTex(512, 512, (g, w) => {
  const c = w / 2; g.fillStyle = '#050407'; g.beginPath(); g.arc(c, c, c, 0, 7); g.fill();
  for (let r = c * .36; r < c * .985; r += 1.6) { g.strokeStyle = `rgba(${40 + (r * 7) % 22},${38 + (r * 5) % 18},${50 + (r * 3) % 20},.55)`; g.lineWidth = .8; g.beginPath(); g.arc(c, c, r, 0, 7); g.stroke(); }
  for (const r of [c * .55, c * .74, c * .88]) { g.strokeStyle = '#020203'; g.lineWidth = 3; g.beginPath(); g.arc(c, c, r, 0, 7); g.stroke(); }   // gaps between tracks
  const sh = g.createLinearGradient(0, 0, w, w); sh.addColorStop(.35, 'rgba(255,255,255,0)'); sh.addColorStop(.5, 'rgba(255,255,255,.10)'); sh.addColorStop(.65, 'rgba(255,255,255,0)');
  g.fillStyle = sh; g.beginPath(); g.arc(c, c, c * .985, 0, 7); g.fill();
  g.fillStyle = '#ff4fb0'; g.beginPath(); g.arc(c, c, c * .34, 0, 7); g.fill();                                   // the label
  g.strokeStyle = '#ffe14f'; g.lineWidth = 6; g.lineCap = 'round';
  for (let j = 0; j < 12; j++) { const t = j / 12 * Math.PI * 2 + .13, r1 = c * .08, r2 = c * (j % 2 ? .17 : .22); g.beginPath(); g.moveTo(c + Math.cos(t) * r1, c + Math.sin(t) * r1); g.lineTo(c + Math.cos(t) * r2, c + Math.sin(t) * r2); g.stroke(); }
  g.fillStyle = '#1a0a14'; g.font = '700 30px ui-monospace, Menlo, monospace'; g.textAlign = 'center'; g.fillText('LOVESPARK', c, c + c * .29);
  g.fillStyle = '#d8d8e0'; g.beginPath(); g.arc(c, c, 5, 0, 7); g.fill();
});
const strobeTex = canvasTex(512, 16, (g, w, h) => { g.fillStyle = '#9a97a8'; g.fillRect(0, 0, w, h); g.fillStyle = '#2a2833'; for (let i = 0; i < 64; i++) g.fillRect(i * 8 + 2, 4, 4, 8); });
const knobGeo = new THREE.CylinderGeometry(.013, .015, .02, 16), knobMat = new THREE.MeshStandardMaterial({ color: 0x1b1824, roughness: .5, metalness: .3 });
const tick = new THREE.MeshBasicMaterial({ color: 0xf2f2f8 });
const put = (mesh, x, y, z, parent) => { mesh.position.set(x, y, z); parent.add(mesh); return mesh; };
for (const x of [-.72, .72]) {
  const deck = new THREE.Group(); deck.position.set(x, 0, 0); booth.add(deck);

      if (/^J_Bip_C_(Spine|Chest|UpperChest|Neck|Head)$/.test(o.name)) C.push({ node: o, q: new THREE.Quaternion() }); }); return { L, R, C }; })());
    h.update();
    for (const side of ['L', 'R', 'C']) for (const a of arm[side]) a.q.copy(a.node.quaternion);
    playMove('lime_dj', ash, (bar - 12) * BAR_SEC);
    for (const side of ['L', 'R']) { const w = Math.max(side === 'L' ? pump.L : pump.R, emo.e); if (w > 0) for (const a of arm[side]) a.node.quaternion.slerp(a.q, w); }
    if (emo.e > 0) for (const a of arm.C) a.node.quaternion.slerp(a.q, emo.e);              // her body joins the emote too
  }
  if (!settled) { ash.springBoneManager?.reset(); settled = true; }   // hair starts from the posed body, not the T-pose
  ash.update(dt);
  ash.scene.updateMatrixWorld(true);
  for (const side of ['left', 'right']) {                                                  // the palm: a little past the wrist, along the forearm
    (h.getRawBoneNode(side + 'Hand') || b(side + 'Hand')).getWorldPosition(handPos[side]);
    (h.getRawBoneNode(side + 'LowerArm') || b(side + 'LowerArm')).getWorldPosition(_elbow);
    handPos[side].addScaledVector(_elbow.subVectors(handPos[side], _elbow).normalize(), .075);
  }
}
// the two booth Claudios: a hop from the booth onto her open hands, a ride, and a hop back
function poseRiders(bar) {
  const emo = emoteAt(bar);
  for (const c of claudios) { if (!c.rider) continue;
    const hp = handPos[c.rider], j = ash ? emo.j : 0, k = 1 - .3 * j;
    c.anchor.position.set(c.baseX + (hp.x - c.baseX) * j, c.anchor.position.y + (hp.y + .035 - c.anchor.position.y) * j + Math.sin(Math.PI * j) * .32, c.baseZ + (hp.z + .02 - c.baseZ) * j);
    c.anchor.rotation.y = c.baseRy * (1 - j) + Math.sin(Math.PI * j) * (c.rider === 'left' ? -1 : 1) * 1.2;      // a half spin in the air
    c.anchor.scale.setScalar(k);
  }
}

// ---------- the Claudios circle Ash (Joona, 2026-11-19: "have the claudios also dance and circle her at some point") ----------
// In the half-time bridge (bars 93-100, 1-based) all seven leave their spots in the first bar, orbit her at chest height a quarter
// turn per bar while hopping and spinning on the beat, and fly back in the last bar before the final drop.
const RING = { from: 68, to: 76, r: 1.1, y: 1.12, size: .4 };
function poseRing(bar) {
  const r = smooth(bar - RING.from) * (1 - smooth(bar - (RING.to - 1)));
  if (r <= 0) return;
  const beat = bar * 4, cz = ash ? ash.scene.position.z : 0;
  claudios.forEach((c, i) => {
    const th = i / claudios.length * Math.PI * 2 + (bar - RING.from) * Math.PI / 2;
    const hop = Math.abs(Math.sin(beat * Math.PI)) * .12, spin = smooth((beat % 2) / 2) * Math.PI * 2 * (i % 2 ? 1 : -1);
    const x = Math.sin(th) * RING.r, z = cz + Math.cos(th) * RING.r, y = RING.y + hop + Math.sin(th * 2) * .05;
    const p = c.anchor.position, x0 = c.surf ? p.x : c.baseX;            // blend from each one's own spot (y is set fresh every frame)
    p.set(x0 + (x - x0) * r, p.y + (y - p.y) * r, c.baseZ + (z - c.baseZ) * r);
    c.anchor.rotation.y = c.baseRy * (1 - r) + (th + Math.PI / 2 + spin) * r;
    c.anchor.scale.setScalar(1 + (RING.size / c.w - 1) * r);
    if (c.surf) c.anchor.visible = true;
  });
}

// ---------- camera: a few fixed angles, cut on bar lines, slight handheld drift ----------
const SHOTS = [
  { p: [0, 1.5, 4.4], t: [0, 1.42, 0] },            // 0 wide, front of the decks
  { p: [.55, 1.5, 2.55], t: [0, 1.36, 0] },          // 1 Ash close
  { p: [-2.7, 1.85, 2.3], t: [-1.9, 1.62, .35] },     // 2 Claudio on the left stack
  { p: [3.7, 1.9, 2.4], t: [0, 1.2, -.6] },          // 3 side, booth and crowd
  { p: [0, 3.1, 4.0], t: [0, 1.25, -1.2] },           // 4 high, the whole room
  { p: [1.6, 1.36, 1.95], t: [1.05, 1.2, .8] },
  { p: [-.75, 1.5, 3.9], t: [-1.3, 1.36, 1.7] },      // 6 the announcer
  { p: [0, 1.5, 2.9], t: [0, 1.3, .15] },            // 7 the six-seven emote
  { p: [1.15, 1.42, 1.55], t: [.7, 1.05, .72] },      // 8 the right deck close: platter, tonearm, pitch fader: Ash, her hands and the booth      // 5 little Claudio on the mixer
];
function shotAt(bar, sec) {
  const [start, name, energy] = sec;
  const em = emoteAt(bar); if (em.on) return em.t < 1 ? 7 : 4;
  if (name === 'announce') return bar < 2.5 ? 0 : (bar < 4.4 ? 6 : (bar < 5.2 ? 4 : (bar < 9.6 ? 6 : 0)));
  if (name === 'introA') return 0;
  if (name === 'introB') return bar - start < 4 ? 1 : 0;   // she has stepped back to dance: show her close first
  if (name === 'bridge') return bar - start < 4 ? 0 : 4;   // the Claudio ring: front, then from above
  const len = energy >= .7 ? 4 : 8, k = Math.floor((bar - start) / len);
  const order = energy >= .9 ? [0, 1, 3, 8, 4, 1, 5, 2] : [1, 0, 2, 8, 0, 5, 4, 1];
  return order[(k + start) % order.length];
}
const tmpT = new THREE.Vector3();
let camOverride = null, soloHide = [];                              // a fixed camera for stills
function poseCamera(bar, sec, pulse) {
  if (camOverride) { camera.position.set(...camOverride.p); tmpT.set(...camOverride.t); camera.lookAt(tmpT); return; }
  const sh = SHOTS[shotAt(bar, sec)], t = bar * 1.9, e = sec[2];
  camera.position.set(sh.p[0] + Math.sin(t * .31) * .05, sh.p[1] + Math.sin(t * .47) * .03 + pulse * .012 * e, sh.p[2] + Math.cos(t * .23) * .06 - (bar % 4) * .03);
  tmpT.set(sh.t[0] + Math.sin(t * .19) * .02, sh.t[1], sh.t[2]); camera.lookAt(tmpT);
}

// ---------- one frame, as a pure function of the bar position ----------
function frame(bar, dt) {
  const sec = sectionAt(bar), [start, name, energy, kick] = sec, beat = bar * 4;
  const ph = kick === 2 ? (beat / 2) % 1 : beat % 1, pulse = kick ? Math.exp(-ph * 5.5) : .25 * Math.exp(-(beat % 1) * 3) * energy;
  const build = name === 'break' || name === 'bridge' ? (bar - start) / 8 : 0;           // 0..1 through a build-up
  drawGlyphs(bar, pulse, energy + build * .5);

  deckBits.xfader.position.x = .05 * Math.sin(beat * Math.PI);                               // rides with her fader hand
  deckBits.faders.forEach((f, i) => { f.position.z = i < 2 ? .1 + .006 * Math.sin(bar * .3 + i) : .08 + .03 * (energy - .5); });
  deckBits.targets.forEach((t) => { t.material.color.setRGB(1, .94, .75).multiplyScalar(.55 + .45 * pulse); });
  leds.forEach((l, i) => { l.visible = (i / 10) < (.25 + pulse * .8 * (.4 + energy)); });
  stacks.forEach((s) => { s.userData['cone0.26'].position.z = .36 + pulse * .035 * energy; s.userData['cone0.17'].position.z = .36 + pulse * .015; });
  const emo = emoteAt(bar);
  claudios.forEach((c, i) => {                       // squash on the kick, hop after it, wobble; blink now and then, surprised when a drop hits
    const hop = Math.abs(Math.sin(beat * Math.PI + i * .4)) * (.02 + .1 * energy) * c.w * 1.6;
    const sq = 1 - .16 * pulse * (.4 + energy);
    c.holder.scale.set(1 + (1 - sq) * .6, sq, 1 + (1 - sq) * .6);
    c.anchor.position.y = c.baseY + hop + (c.surf ? Math.sin(beat * Math.PI) * .06 : 0);
    if (c.surf) { c.anchor.position.x = Math.sin(bar * .45) * 2.6; c.anchor.visible = energy >= .5; c.anchor.rotation.y = Math.sin(bar * .45 + 1.2) * .5; }
    const turn = (c.baseX < -.01 ? 1 : c.baseX > .01 ? -1 : (i % 2 ? 1 : -1)) * emo.alt * emo.e;   // left side up on "six", right side on "seven", like her hands

    if (!c.rider) c.anchor.position.y += Math.max(0, turn) * .42 * c.w;
    const em = c.vrm?.expressionManager;
    if (em) {
      const blinkPh = (bar * 1.3 + i * .37) % 1;
      em.setValue('blink', blinkPh < .04 ? 1 : 0);
      em.setValue('surprised', ((name === 'drop' || name === 'final') && bar - start < 1) || (c.rider && emo.j > .02 && emo.j < .98) ? 1 : 0);
      c.vrm.update(dt);
    }

  poseCrowd(bar, sec, pulse); poseAsh(bar, sec, pulse, dt); poseRiders(bar); poseRing(bar); poseMC(bar, sec, pulse, dt);
  spots.forEach((s, i) => {
    s.intensity = (5 + 9 * energy) * (.55 + .45 * pulse) * (name === 'introA' ? .3 : 1);
    const a = bar * (.5 + i * .13) + i * 1.7; s.target.position.set(Math.sin(a) * 4.2, .8, -2.6 + Math.cos(a * .7) * 2.2); s.target.updateMatrixWorld();
  });
  wash.intensity = 2 + 4 * energy * (.4 + .6 * pulse); wash.color.setHex(Math.floor(bar / 4) % 2 ? CYAN : PINK);
  const drop = (name === 'drop' || name === 'final') && bar - start < 2;                 // strobe through the first 2 bars of a drop
  const rollHit = build > .5 ? ((beat * (build > .75 ? 4 : 2)) % 1 < .25 ? 1 : 0) * (build - .5) * 2 : 0;
  strobe.intensity = drop ? ((beat * 4) % 1 < .35 ? 7 : 0) : rollHit * 3.5;
  key.intensity = 3.2 + 1 * energy;
  signs.forEach(({ m, l, i }) => {                       // a slow breathing glow, a kick of brightness on the beat, a rare flicker
    const flick = rand(Math.floor(bar * 16) + i * 77) > .985 ? .35 : 1, g = (.82 + .18 * Math.sin(bar * 1.3 + i * 1.7)) * (.85 + .25 * pulse * energy) * flick;
    m.material.opacity = Math.min(1, g); l.intensity = m.visible && !m.userData.isName ? (2.5 + 3 * energy) * g : 0;   // a hidden sign lights nothing; the name signs never light the DJ
  });
  boothSign.material.opacity = .85 + .15 * pulse;
  glows.forEach(({ l, k, bar: b, c }, i) => { const g = .6 + .4 * Math.sin(bar * .9 + i * 1.3) + .5 * pulse * energy; l.intensity = k * g; b.material.color.setHex(c).multiplyScalar(.5 + .5 * Math.min(1, g)); });

  poseCamera(bar, sec, pulse);
  soloHide.forEach((o) => { o.visible = false; });       // channel-art stills of the DJ alone
  composer.render();
}

// ---------- the clock: the set's own scheduler, or a free-running preview clock ----------
const ed = document.getElementById('ed'), params = new URLSearchParams(location.search);
let sched = null, fake = params.has('bar') ? { bar0: +params.get('bar'), t0: performance.now(), hold: params.has('hold') } : null;
const barNow = () => sched ? sched.now() % BARS : fake ? (fake.hold ? fake.bar0 : (fake.bar0 + (performance.now() - fake.t0) / 1000 * (126 / 240)) % BARS) : 0;
async function still(name, w, h, bar, cam, { names = false, fov = 38, settle = 50, solo = false, crowdDim = 1 } = {}) {
  renderer.setPixelRatio(1); renderer.setSize(w, h, false); composer.setSize(w, h); camera.fov = fov; camera.aspect = w / h; camera.updateProjectionMatrix();
  camOverride = cam; nameSigns.forEach((m) => { m.visible = names; });
  const crowd0 = crowdMat.color.clone(); crowdMat.color.multiplyScalar(crowdDim); dancerMats.forEach((m) => m.color.multiplyScalar(crowdDim));   // a darker crowd so the DJ reads against it
  soloHide = solo ? [bodies, arms, phones, mouths, logos, ...people.map((p) => p.head), ...dancers.map((d) => d.holder), mc?.scene, ...claudios.map((c) => c.anchor)].filter(Boolean) : [];
  for (let i = 0; i < settle; i++) frame(bar, 1 / 60);
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
  const res = await fetch('/save/' + name, { method: 'POST', headers: { 'X-Club-Save': '1' }, body: blob });
  soloHide.forEach((o) => { o.visible = true; }); soloHide = []; crowdMat.color.copy(crowd0); if (crowdDim) dancerMats.forEach((m) => m.color.multiplyScalar(1 / crowdDim));
  camOverride = null; nameSigns.forEach((m) => { m.visible = false; }); camera.fov = 38; renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); resize();
  return { name, bytes: blob.size, saved: res.ok };
}
window.club = { still, POSE, moves, dancers, rigs, claudios, emoteAt, pumpAt, handPos, render: (bar, n = 1) => { for (let i = 0; i < n; i++) frame(bar, 1 / 60); },
  resettle: () => { settled = false; mcSettled = false; }, mcTune, setBar: (x) => { fake = { bar0: x, t0: performance.now(), hold: true }; sched = null; }, barNow, sectionAt, tune, SHOTS, vrm: null, frames: 0 };
// ---------- video render (tools/club/render_video.py): fixed size, one frame per call at an exact bar position ----------
window.club.offline = (w, h) => { offline = true; renderer.setPixelRatio(1); renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); };
window.club.shot = (bar, dt, q = .93) => { frame(bar, dt); return canvas.toDataURL('image/jpeg', q); };
window.club.dbg = { bloom, key, scene, composer, get ash() { return ash; } };   // for render diagnostics
window.club.ready = () => ({ ash: !!ash, mc: !!mc, claudios: claudios.filter((c) => c.vrm).length, moves: Object.keys(moves).length, dancers: dancers.length ?? Object.keys(dancers).length });
if (fake) document.getElementById('go').remove();
document.getElementById('start')?.addEventListener('click', async () => {
  const btn = document.getElementById('start'); btn.textContent = 'LOADING…';
  const code = await (await fetch(TRACK)).text();
  await Promise.all(['mc/mc1__s42.wav', 'mc/mc2c__s42.wav', 'mc/crowd.wav'].map((f) => fetch('/samples/' + f).then((r) => r.arrayBuffer()).catch(() => 0)));
  const m = ed.editor, stemName = params.get('stems');
  const attach = stemName ? await captureStems(stemName, getAudioContext()) : null;
  m.setCode(code); await m.evaluate();
  if (attach) attach();
  else applySound();
  sched = m.repl.scheduler; fake = null; document.getElementById('go').remove();
  if (stemName) { const t = setInterval(() => { if (sched.now() >= BARS + 1.6) { clearInterval(t); window.club.stems.stop().then(() => m.stop?.()); } }, 400); }
});
// ---------- stem capture (?stems=name): every bus recorded separately and sample-aligned, in one silent pass ----------
// One worklet takes all buses as channels of a single stream, so the stems cannot drift apart; pieces are appended to
// renders/<name>.f32 (raw 32-bit float). The speakers are disconnected while it runs.
const STEMS = [['master', null, 2], ['kick', 9, 1], ['drums', 1, 2], ['bass', 8, 1], ['music', 2, 2], ['lead', 3, 2], ['chops', 4, 2], ['far', 5, 2], ['line', 6, 2], ['mc', 7, 2]];
async function captureStems(name, ctx) {
  const total = STEMS.reduce((a, x) => a + x[2], 0), st = window.club.stems = { name, channels: total, rate: ctx.sampleRate, frames: 0, sent: 0, state: 'recording', layout: STEMS.map(([n, , c]) => n + ':' + c).join(' ') };
  const src = `class Cap extends AudioWorkletProcessor { constructor(o) { super(); this.n = o.processorOptions.n; this.buf = new Float32Array(this.n * 128 * 96); this.w = 0; }
    process(inputs) { const inp = inputs[0]; for (let i = 0; i < 128; i++) for (let c = 0; c < this.n; c++) this.buf[this.w++] = inp[c] ? inp[c][i] : 0;
      if (this.w >= this.buf.length) { this.port.postMessage(this.buf, [this.buf.buffer]); this.buf = new Float32Array(this.n * 128 * 96); this.w = 0; } return true; } }
    registerProcessor('cap', Cap);`;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  return () => {                                     // call right after the audio graph exists
    const c = getSuperdoughAudioController(), merger = ctx.createChannelMerger(total);
    const node = new AudioWorkletNode(ctx, 'cap', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1], channelCount: total, channelCountMode: 'explicit', channelInterpretation: 'discrete', processorOptions: { n: total } });
    const sink = ctx.createGain(); sink.gain.value = 0; merger.connect(node); node.connect(sink).connect(ctx.destination);
    let ch = 0;
    for (const [, orbit, n] of STEMS) {
      const out = orbit == null ? c.output.destinationGain : c.getOrbit(orbit).output;
      if (n === 2) { const sp = ctx.createChannelSplitter(2); out.connect(sp); sp.connect(merger, 0, ch); sp.connect(merger, 1, ch + 1); }
      else { const mono = ctx.createGain(); mono.channelCount = 1; mono.channelCountMode = 'explicit'; out.connect(mono); mono.connect(merger, 0, ch); }
      ch += n;
    }
    try { c.output.destinationGain.disconnect(ctx.destination); st.silent = true; } catch (e) { st.silent = false; }
    let queue = Promise.resolve(), pending = [], first = true;
    const flush = () => { if (!pending.length) return; const body = new Blob(pending); pending = [];
      const headers = { 'X-Club-Save': '1' }; if (first) { headers['X-Club-First'] = '1'; first = false; }
      queue = queue.then(() => fetch('/append/' + name + '.f32', { method: 'POST', headers, body })).then((r) => { if (!r.ok) st.error = 'http ' + r.status; st.sent += body.size; }).catch((e) => { st.error = String(e); }); };
    node.port.onmessage = (e) => { if (st.state !== 'recording') return; pending.push(e.data); st.frames += e.data.length / total; if (pending.length >= 16) flush(); };
    st.stop = async () => { st.state = 'stopping'; flush(); await queue; st.state = 'saved'; };
  };
}
// ---------- sound on/off: a button (or the M key); the choice is remembered across reloads ----------
const muteBtn = document.getElementById('mute');
let muted = false; try { muted = localStorage.getItem('clubMuted') === '1'; } catch {}
function applySound() {
  muteBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; muteBtn.setAttribute('aria-pressed', String(muted));
  if (params.has('stems')) return;                    // a stem capture runs silent on its own
  let c = null; try { c = getSuperdoughAudioController(); } catch {}
  // the layers sum to +4.5 dBFS (measured from stems): 0.56 (-5 dB) keeps the live output from clipping
  if (c?.output?.destinationGain) c.output.destinationGain.gain.value = muted ? 0 : .56;
}
function toggleSound() { muted = !muted; try { localStorage.setItem('clubMuted', muted ? '1' : '0'); } catch {} applySound(); }
muteBtn.addEventListener('click', toggleSound);
addEventListener('keydown', (e) => { if (e.key === 'm' || e.key === 'M') toggleSound(); });
applySound();
let last = performance.now();
(function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; if (!offline) frame(barNow(), dt); window.club.frames++; requestAnimationFrame(loop); })(last);
</script>
