<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Space Club</title>
<script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
} }
</script>
<style>
  html, body { margin:0; height:100%; background:#05030a; overflow:hidden; }
  canvas#stage { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #ed { position:fixed; left:0; top:0; width:600px; height:300px; opacity:0; pointer-events:none; z-index:-1; }
  canvas#stage { z-index:1; }
  #go { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(5,3,10,.72); z-index:5; }
  #go button { font:700 20px ui-monospace, Menlo, monospace; letter-spacing:.08em; color:#140a10; background:#ff4fb0; border:0;
    border-radius:8px; padding:16px 28px; cursor:pointer; box-shadow:0 0 28px rgba(255,79,176,.6); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="go"><button id="start">START THE SET</button></div>
<strudel-editor id="ed"><!--
// loading
--></strudel-editor>

<script type="module">
// The club: a Three.js stage driven by the set's own clock (bars), so every light, bounce and cut lands on the music.
// ?bar=60 previews a position without audio (also the hook for rendering frames later: window.club.setBar(x)).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const TRACK = '/patterns/10-cyber-space-set.strudel.js', BARS = 132;
// [first bar, name, energy 0..1, kick: 0 none / 1 four-on-the-floor / 2 half-time]
const SECTIONS = [
  [0, 'announce', .55, 0], [12, 'introA', .2, 0], [20, 'introB', .3, 0], [28, 'build', .55, 1], [36, 'A', .7, 1],
  [52, 'break', .35, 0], [60, 'drop', 1, 1], [76, 'B', .75, 1], [92, 'bridge', .45, 2], [100, 'final', 1, 1],
  [116, 'outroA', .5, 1], [124, 'outroB', .2, 0]];
const sectionAt = (bar) => { let s = SECTIONS[0]; for (const x of SECTIONS) if (bar >= x[0]) s = x; return s; };
const PINK = 0xff4fb0, CYAN = 0x3ef0ff, ORANGE = 0xe8622c;
const rand = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };   // fixed per index

// ---------- renderer ----------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05030a); scene.fog = new THREE.Fog(0x05030a, 6, 16);
const camera = new THREE.PerspectiveCamera(38, 1, .1, 60);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .5, .45, .93); composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- room ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x0b0714, roughness: .35, metalness: .6 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
// back wall screen: the glyph grid from the live page, as a texture
const gc = document.createElement('canvas'); gc.width = 768; gc.height = 320; const gx = gc.getContext('2d');
const gtex = new THREE.CanvasTexture(gc); gtex.colorSpace = THREE.SRGBColorSpace;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), new THREE.MeshBasicMaterial({ map: gtex }));
screen.position.set(0, 2.9, -6.5); scene.add(screen);
const GLYPHS = '.:-=+*#%@░▒▓█▚▞◢◣◤◥アカサタナハマヤラワ01';
function drawGlyphs(bar, pulse, energy) {
  const W = gc.width, H = gc.height, CELL = 16, s = bar * 1.9;
  const g = gx.createLinearGradient(0, 0, W, H); const hue = 300 + 40 * Math.sin(s * .07);
  g.addColorStop(0, `hsl(${hue},85%,${8 + 10 * pulse * energy}%)`); g.addColorStop(1, `hsl(190,90%,${7 + 8 * pulse * energy}%)`);
  gx.fillStyle = g; gx.fillRect(0, 0, W, H);
  gx.font = `${CELL - 3}px ui-monospace, Menlo, monospace`; gx.textBaseline = 'top';
  const rows = H / CELL, cols = W / CELL, scan = (bar % 1) * rows;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const n = Math.sin(x * .31 + s * .9) + Math.cos(y * .27 - s * .7) + Math.sin((x + y) * .11 + s * .3);
    const v = (n + 3) / 6, near = Math.max(0, 1 - Math.abs(y - scan) / 3);
    const a = .06 + (.3 + .5 * energy) * v * v + .5 * near * pulse;
    if (a < .1) continue;
    gx.fillStyle = (x + y) % 7 === 0 ? `rgba(62,240,255,${a})` : `rgba(255,79,176,${a})`;
    gx.fillText(GLYPHS[Math.floor(v * (GLYPHS.length - 1) + s * 2 + x) % GLYPHS.length], x * CELL, y * CELL);
  }
  gtex.needsUpdate = true;
}
// neon tubes
const tube = (color, x, y, z, len, rotZ = 0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(len, .05, .05), new THREE.MeshBasicMaterial({ color })); m.position.set(x, y, z); m.rotation.z = rotZ; scene.add(m); return m; };
const tubes = [tube(PINK, -6.2, 2.6, -3, 5, Math.PI / 2), tube(CYAN, 6.2, 2.6, -3, 5, Math.PI / 2), tube(PINK, 0, 5.5, -6.3, 12), tube(CYAN, 0, .25, -6.3, 12)];

// ---------- neon: "CLAUDE LOVES ART" (Joona, 2026-11-19), drawn as glowing tube lettering; each sign also lights the room ----------
const YELLOW = 0xffe14f, GREEN = 0x6bff9e, VIOLET = 0xb46bff;
const hex = (c) => '#' + c.toString(16).padStart(6, '0');
function neonCanvas(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  x.lineCap = x.lineJoin = 'round'; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const [blur, alpha, core] of [[38, .55, false], [16, .9, false], [0, 1, true]]) { x.shadowBlur = blur; x.globalAlpha = alpha; draw(x, core); }   // halo, glow, white-hot core
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const neonText = (x, text, cx, cy, size, color, core) => {
  x.font = `italic 700 ${size}px "Brush Script MT", "Snell Roundhand", "Segoe Script", cursive`;
  x.shadowColor = color; x.strokeStyle = core ? '#fff7fb' : color; x.lineWidth = core ? size * .035 : size * .09; x.strokeText(text, cx, cy);
};
const signs = [];
function addSign(tex, w, h, x, y, z, lightColor, ry = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m);
  const l = new THREE.PointLight(lightColor, 0, 9, 1.6); l.position.set(x, y, z + .7); scene.add(l);
  signs.push({ m, l, i: signs.length }); return m;
}
// back wall, left: the words in two colours
addSign(neonCanvas(1024, 512, (x, core) => { neonText(x, 'Claude', 512, 150, 190, hex(CYAN), core); neonText(x, 'loves art', 512, 360, 170, hex(PINK), core); }), 4.2, 2.1, -3.3, 3.25, -6.35, CYAN);
// back wall, right: a heart with the starburst inside it, and a paintbrush stroke under it
addSign(neonCanvas(768, 768, (x, core) => {
  x.shadowColor = hex(PINK); x.strokeStyle = core ? '#fff7fb' : hex(PINK); x.lineWidth = core ? 7 : 20;
  x.beginPath(); x.moveTo(384, 610); x.bezierCurveTo(60, 400, 130, 120, 384, 250); x.bezierCurveTo(638, 120, 708, 400, 384, 610); x.stroke();
  x.shadowColor = hex(YELLOW); x.strokeStyle = core ? '#fffdf0' : hex(YELLOW); x.lineWidth = core ? 5 : 14;
  for (let j = 0; j < 12; j++) { const a = j / 12 * Math.PI * 2 + .13, r = j % 2 ? 62 : 84; x.beginPath(); x.moveTo(384 + Math.cos(a) * 20, 400 + Math.sin(a) * 20); x.lineTo(384 + Math.cos(a) * r, 400 + Math.sin(a) * r); x.stroke(); }
  x.shadowColor = hex(GREEN); x.strokeStyle = core ? '#f4fff8' : hex(GREEN); x.lineWidth = core ? 6 : 16;
  x.beginPath(); x.moveTo(150, 700); x.bezierCurveTo(300, 650, 470, 740, 620, 690); x.stroke();
}), 2.7, 2.7, 3.4, 3.2, -6.35, PINK);
// centre top: the house name
addSign(neonCanvas(1280, 400, (x, core) => { neonText(x, 'LoveSpark', 640, 200, 230, hex(VIOLET), core); }), 4.6, 1.44, 0, 4.45, -6.35, VIOLET);
// the DJ's name, either side of her head: shown only in channel-art stills
const nameSigns = [['Bvby', -.86, CYAN], ['Ash', .84, PINK]].map(([word, x, col]) => {
  const m = addSign(neonCanvas(640, 360, (c, core) => neonText(c, word, 320, 180, 250, hex(col), core)), 1.05, .59, x, 1.6, -.5, col); m.visible = false; m.userData.isName = true; m.renderOrder = 3;
  const board = new THREE.Mesh(new THREE.PlaneGeometry(1.0, .5), new THREE.MeshBasicMaterial({ color: 0x07040d, transparent: true, opacity: .86 })); board.position.z = -.02; board.renderOrder = 2; m.add(board);   // a dark board so the tubes read against the crowd
  return m; });
// high and small, either side: single words in other colours
addSign(neonCanvas(512, 256, (x, core) => neonText(x, 'art', 256, 128, 190, hex(YELLOW), core)), 1.6, .8, -5.6, 2.2, -4.6, YELLOW, .9);
addSign(neonCanvas(512, 256, (x, core) => neonText(x, 'love', 256, 128, 170, hex(VIOLET), core)), 1.6, .8, 5.6, 2.2, -4.6, VIOLET, -.9);
// underglow: light spilling onto the floor from beneath the booth, the speaker stacks and the podiums
const glows = [[0, .12, 1.45, PINK, 2.2], [-1.9, .12, .9, CYAN, 3], [1.9, .12, .9, VIOLET, 3], [-1.3, .12, -.4, GREEN, 2.5], [1.3, .12, -.4, YELLOW, 2.5]].map(([x, y, z, c, k]) => {
  const l = new THREE.PointLight(c, 0, 5, 1.5); l.position.set(x, y, z); scene.add(l);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(k > 4 ? 2.5 : .75, .03, .03), new THREE.MeshBasicMaterial({ color: c })); bar.position.set(x, .03, z - .12); scene.add(bar);
  return { l, k, bar, c };
});

// ---------- the booth ----------
const dark = new THREE.MeshStandardMaterial({ color: 0x15101f, roughness: .5, metalness: .4 });
const booth = new THREE.Group(); scene.add(booth); booth.position.set(0, 0, .75);
const table = new THREE.Mesh(new THREE.BoxGeometry(2.6, .98, .75), dark); table.position.y = .49; booth.add(table);
const front = new THREE.Mesh(new THREE.PlaneGeometry(2.5, .8), new THREE.MeshBasicMaterial({ map: gtex, color: 0x555566 })); front.position.set(0, .47, .378); booth.add(front);   // LED front panel
const boothSign = new THREE.Mesh(new THREE.PlaneGeometry(2.3, .62), new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  map: neonCanvas(1400, 380, (x, core) => neonText(x, 'Claude loves art', 700, 190, 168, hex(PINK), core)) })); boothSign.position.set(0, .47, .386); booth.add(boothSign);
const strip = new THREE.Mesh(new THREE.BoxGeometry(2.6, .04, .02), new THREE.MeshBasicMaterial({ color: PINK })); strip.position.set(0, .93, .385); booth.add(strip);
const platters = [];
for (const x of [-.72, .72]) {
  const deck = new THREE.Mesh(new THREE.BoxGeometry(.62, .06, .5), new THREE.MeshStandardMaterial({ color: 0x221a30, roughness: .4, metalness: .6 })); deck.position.set(x, 1.01, 0); booth.add(deck);
  const pl = new THREE.Mesh(new THREE.CylinderGeometry(.2, .2, .03, 40), new THREE.MeshStandardMaterial({ color: 0x08060c, roughness: .25, metalness: .8 })); pl.position.set(x, 1.055, 0); booth.add(pl);
  const mark = new THREE.Mesh(new THREE.BoxGeometry(.18, .005, .02), new THREE.MeshBasicMaterial({ color: CYAN })); mark.position.set(.09, .02, 0); pl.add(mark); platters.push(pl);
}
const mixer = new THREE.Mesh(new THREE.BoxGeometry(.42, .07, .5), new THREE.MeshStandardMaterial({ color: 0x2a2038, roughness: .4, metalness: .5 })); mixer.position.set(0, 1.015, 0); booth.add(mixer);
const leds = [];
for (let i = 0; i < 10; i++) { const l = new THREE.Mesh(new THREE.BoxGeometry(.025, .012, .025), new THREE.MeshBasicMaterial({ color: i > 6 ? PINK : CYAN })); l.position.set(-.15 + (i % 2) * .3, 1.056, -.2 + Math.floor(i / 2) * .09); booth.add(l); leds.push(l); }
// speaker stacks, a Claudio on each
const stacks = [];
for (const x of [-1.9, 1.9]) {
  const st = new THREE.Group(); st.position.set(x, 0, .35); scene.add(st); stacks.push(st);
  const box = new THREE.Mesh(new THREE.BoxGeometry(.8, 1.3, .7), dark); box.position.y = .65; st.add(box);
  for (const [y, r] of [[.38, .26], [.95, .17]]) { const cone = new THREE.Mesh(new THREE.CylinderGeometry(r, r * .7, .06, 32), new THREE.MeshStandardMaterial({ color: 0x050308, roughness: .3, metalness: .7 })); cone.rotation.x = Math.PI / 2; cone.position.set(0, y, .36); st.add(cone); st.userData['cone' + r] = cone; }
}

// ---------- Claudio (built from his master sheet: fuzzy orange, stepped pixel body, two stub arms, six legs, pixel arch eyes, no mouth) ----------
function makeClaudio() {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body); g.userData.body = body;
  const fur = new THREE.MeshStandardMaterial({ color: ORANGE, roughness: 1, emissive: 0x3a1206, emissiveIntensity: .55 });
  const black = new THREE.MeshBasicMaterial({ color: 0x050505 });
  const add = (w, h, d, x, y, z, m = fur) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); body.add(b); return b; };
  add(1.5, .95, .9, 0, .72, 0);                      // core, flat top
  add(1.74, .55, .82, 0, .66, 0);                    // stepped shoulders
  add(1.24, .12, .8, 0, 1.25, 0);                    // stepped top edge
  g.userData.arms = [add(.24, .26, .5, -.98, .68, 0), add(.24, .26, .5, .98, .68, 0)];
  g.userData.legs = [-.62, -.4, -.18, .18, .4, .62].map(x => add(.17, .3, .5, x, .13, 0));
  for (const ex of [-.36, .36]) {                    // happy closed eyes: one block on top, two lower at the sides
    add(.15, .075, .03, ex, .93, .455, black); add(.075, .075, .03, ex - .11, .855, .455, black); add(.075, .075, .03, ex + .11, .855, .455, black);
  }
  return g;
}
// The seven Claudios from ashley-pc (rigged VRMs with blink and surprised); the code-built one stands in until each loads.
// [variant, x, y, z, width in metres, turn, crowd-surfer]
const CLAUDIOS = [
  ['headphones', -1.9, 1.3, .35, .78, .25], ['cyber', 1.9, 1.3, .35, .78, -.25],          // on the speaker stacks
  ['classic', -1.08, 1.04, .8, .34, .3], ['shades', 1.08, 1.04, .8, .34, -.3],            // on the booth
  ['crown', -1.3, 1.0, -.85, .62, .15], ['snapback', 1.3, 1.0, -.85, .62, -.15],          // on podiums behind Ash
  ['bunny', 0, 2.0, -2.2, .56, 0, true]];                                                 // carried over the crowd
for (const x of [-1.3, 1.3]) {
  const pod = new THREE.Mesh(new THREE.BoxGeometry(.8, 1.0, .6), dark); pod.position.set(x, .5, -.85); scene.add(pod);
  const led = new THREE.Mesh(new THREE.BoxGeometry(.8, .04, .02), new THREE.MeshBasicMaterial({ color: CYAN })); led.position.set(x, .96, -.54); scene.add(led);
}
const claudios = [];
const claudioLoader = new GLTFLoader().register((p) => new VRMLoaderPlugin(p));
CLAUDIOS.forEach(([variant, x, y, z, w, ry, surf], i) => {
  const anchor = new THREE.Group(); anchor.position.set(x, y, z); anchor.rotation.y = ry; scene.add(anchor);
  const holder = new THREE.Group(); anchor.add(holder);
  const standIn = makeClaudio(); standIn.scale.setScalar(w / 2.2); holder.add(standIn);
  const c = { anchor, holder, baseX: x, baseY: y, baseZ: z, baseRy: ry, w, surf: !!surf, vrm: null, variant, i,
    rider: variant === 'classic' ? 'right' : variant === 'shades' ? 'left' : null };   // classic sits on her right (viewer's left), shades on her left
  claudios.push(c);
  claudioLoader.load(`/models/claudio/Claudio-${variant}.vrm`, (gltf) => {
    const vrm = gltf.userData.vrm; VRMUtils.rotateVRM0(vrm); vrm.scene.traverse((o) => { o.frustumCulled = false; });
    const box = new THREE.Box3().setFromObject(vrm.scene), size = box.getSize(new THREE.Vector3()), k = w / Math.max(size.x, .001);
    vrm.scene.scale.setScalar(k); vrm.scene.position.set(-(box.min.x + box.max.x) / 2 * k, -box.min.y * k, -(box.min.z + box.max.z) / 2 * k);
    holder.remove(standIn); holder.add(vrm.scene); c.vrm = vrm;
  }, undefined, (e) => console.error('claudio model failed to load: ' + variant, e));
});

// ---------- crowd (behind the DJ): cel-shaded dancers, each with their own hair, hair colour and drawn face ----------
const N = 54, dummy = new THREE.Object3D();
const ramp = new THREE.DataTexture(new Uint8Array([70, 70, 70, 255, 150, 150, 150, 255, 255, 255, 255, 255]), 3, 1); ramp.needsUpdate = true;
ramp.minFilter = ramp.magFilter = THREE.NearestFilter;                                  // three flat tones = the cel look
const toon = (color, k = .42) => new THREE.MeshToonMaterial({ color: new THREE.Color(color).multiplyScalar(k), gradientMap: ramp });   // dimmed: club lights do the colouring
const crowdMat = toon(0xffffff, .42);
const bodies = new THREE.InstancedMesh(new THREE.CapsuleGeometry(.19, .62, 4, 10), crowdMat, N);
const arms = new THREE.InstancedMesh(new THREE.CapsuleGeometry(.05, .5, 3, 8), crowdMat, N * 2);
const phones = new THREE.InstancedMesh(new THREE.BoxGeometry(.08, .15, .01), new THREE.MeshBasicMaterial({ color: 0xcfe8ff }), N);
const mouths = new THREE.InstancedMesh(new THREE.SphereGeometry(.03, 10, 8), new THREE.MeshBasicMaterial({ color: 0x3a0f1c }), N);
const SHIRTS = [0xe8d9ff, 0xffd0e6, 0xbfe9ff, 0xfff0c2, 0xd6ffe4, 0xffc9b8, 0xcfd4ff, 0xf5f5f5];
const HAIR = [0xff8fc0, 0xf2b441, 0xff7a3d, 0x57d6c9, 0xb08cff, 0x2c3e8f, 0xf4f1ea, 0xd9423a, 0x7a4a2a, 0x1b1b2a, 0x9be36b, 0xff5fa8];
const SKIN = [0xffe2cf, 0xf6cdb0, 0xe3ad86, 0xc98a62, 0x9a6444, 0x7a4b33];
const EYES = ['#3a6bd8', '#2e9e6e', '#8a4fd0', '#b5651d', '#d24b6a', '#2bb3c0', '#444'];

// one sheet of 64 drawn faces; every dancer gets a different cell
const FC = 128, faceSheet = document.createElement('canvas'); faceSheet.width = faceSheet.height = FC * 8;
const fx = faceSheet.getContext('2d');
function drawFace(k) {
  const ox = (k % 8) * FC, oy = Math.floor(k / 8) * FC, r = (j) => rand(k * 13 + j);
  fx.save(); fx.translate(ox, oy);
  const eyeY = 54 + r(1) * 6, gap = 23 + r(2) * 6, ew = 11 + r(3) * 5, eh = 9 + r(4) * 9, tilt = (r(5) - .5) * .5, iris = EYES[Math.floor(r(6) * EYES.length)];
  const closed = r(7) > .88, lash = r(8) > .5;
  for (const sd of [-1, 1]) {
    const cx = 64 + sd * gap;
    fx.save(); fx.translate(cx, eyeY); fx.rotate(sd * tilt * .4);
    if (closed) { fx.strokeStyle = '#20141c'; fx.lineWidth = 3.5; fx.lineCap = 'round'; fx.beginPath(); fx.arc(0, -2, ew * .8, .15 * Math.PI, .85 * Math.PI); fx.stroke(); }
    else {
      fx.fillStyle = '#fff'; fx.beginPath(); fx.ellipse(0, 0, ew, eh, 0, 0, 7); fx.fill();
      fx.fillStyle = iris; fx.beginPath(); fx.ellipse(0, 1, ew * .62, eh * .86, 0, 0, 7); fx.fill();
      fx.fillStyle = '#16101a'; fx.beginPath(); fx.ellipse(0, 2, ew * .3, eh * .45, 0, 0, 7); fx.fill();
      fx.fillStyle = '#fff'; fx.beginPath(); fx.ellipse(-ew * .28, -eh * .38, ew * .2, eh * .2, 0, 0, 7); fx.fill();
      fx.strokeStyle = '#20141c'; fx.lineWidth = 4; fx.lineCap = 'round'; fx.beginPath(); fx.ellipse(0, 0, ew + 1, eh + 1, 0, 1.05 * Math.PI, 1.95 * Math.PI); fx.stroke();   // heavy upper lid
      if (lash) { fx.lineWidth = 2.5; fx.beginPath(); fx.moveTo(sd * (ew + 1), -2); fx.lineTo(sd * (ew + 6), -7); fx.stroke(); }
    }
    fx.restore();
    fx.strokeStyle = '#2a1a22'; fx.lineWidth = 3 + r(9) * 2; fx.lineCap = 'round'; fx.beginPath();                    // brow: angle sets the mood
    const by = eyeY - eh - 9 - r(10) * 4, slope = (r(11) - .5) * 9;

// ---------- one frame, as a pure function of the bar position ----------

  const rollHit = build > .5 ? ((beat * (build > .75 ? 4 : 2)) % 1 < .25 ? 1 : 0) * (build - .5) * 2 : 0;

  key.intensity = 3.2 + 1 * energy;
  signs.forEach(({ m, l, i }) => {                       // a slow breathing glow, a kick of brightness on the beat, a rare flicker
    const flick = rand(Math.floor(bar * 16) + i * 77) > .985 ? .35 : 1, g = (.82 + .18 * Math.sin(bar * 1.3 + i * 1.7)) * (.85 + .25 * pulse * energy) * flick;
    m.material.opacity = Math.min(1, g); l.intensity = m.visible && !m.userData.isName ? (2.5 + 3 * energy) * g : 0;   // a hidden sign lights nothing; the name signs never light the DJ
  });

  glows.forEach(({ l, k, bar: b, c }, i) => { const g = .6 + .4 * Math.sin(bar * .9 + i * 1.3) + .5 * pulse * energy; l.intensity = k * g; b.material.color.setHex(c).multiplyScalar(.5 + .5 * Math.min(1, g)); });

}

// ---------- the clock: the set's own scheduler, or a free-running preview clock ----------
const ed = document.getElementById('ed'), params = new URLSearchParams(location.search);
let sched = null, fake = params.has('bar') ? { bar0: +params.get('bar'), t0: performance.now(), hold: params.has('hold') } : null;
const barNow = () => sched ? sched.now() % BARS : fake ? (fake.hold ? fake.bar0 : (fake.bar0 + (performance.now() - fake.t0) / 1000 * (126 / 240)) % BARS) : 0;
async function still(name, w, h, bar, cam, { names = false, fov = 38, settle = 50, solo = false, crowdDim = 1 } = {}) {
  renderer.setPixelRatio(1); renderer.setSize(w, h, false); composer.setSize(w, h); camera.fov = fov; camera.aspect = w / h; camera.updateProjectionMatrix();
  camOverride = cam; nameSigns.forEach((m) => { m.visible = names; });
  const crowd0 = crowdMat.color.clone(); crowdMat.color.multiplyScalar(crowdDim);   // a darker crowd so the DJ reads against it
  soloHide = solo ? [bodies, arms, phones, mouths, logos, ...people.map((p) => p.head), mc?.scene, ...claudios.map((c) => c.anchor)].filter(Boolean) : [];
  for (let i = 0; i < settle; i++) frame(bar, 1 / 60);
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
  const res = await fetch('/save/' + name, { method: 'POST', headers: { 'X-Club-Save': '1' }, body: blob });
  soloHide.forEach((o) => { o.visible = true; }); soloHide = []; crowdMat.color.copy(crowd0);
  camOverride = null; nameSigns.forEach((m) => { m.visible = false; }); camera.fov = 38; renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); resize();

window.club = { still, POSE, claudios, emoteAt, pumpAt, handPos, render: (bar, n = 1) => { for (let i = 0; i < n; i++) frame(bar, 1 / 60); },
  resettle: () => { settled = false; mcSettled = false; }, mcTune, setBar: (x) => { fake = { bar0: x, t0: performance.now(), hold: true }; sched = null; }, barNow, sectionAt, tune, SHOTS, vrm: null, frames: 0 };
if (fake) document.getElementById('go').remove();
document.getElementById('start')?.addEventListener('click', async () => {
  const btn = document.getElementById('start'); btn.textContent = 'LOADING…';
  const code = await (await fetch(TRACK)).text();
  await Promise.all(['mc/mc1__s42.wav', 'mc/mc2c__s42.wav', 'mc/crowd.wav'].map((f) => fetch('/samples/' + f).then((r) => r.arrayBuffer()).catch(() => 0)));

// ---------- stem capture (?stems=name): every bus recorded separately and sample-aligned, in one silent pass ----------
// One worklet takes all buses as channels of a single stream, so the stems cannot drift apart; pieces are appended to

const STEMS = [['master', null, 2], ['kick', 9, 1], ['drums', 1, 2], ['bass', 8, 1], ['music', 2, 2], ['lead', 3, 2], ['chops', 4, 2], ['far', 5, 2], ['line', 6, 2], ['mc', 7, 2]];
async function captureStems(name, ctx) {

  const src = `class Cap extends AudioWorkletProcessor { constructor(o) { super(); this.n = o.processorOptions.n; this.buf = new Float32Array(this.n * 128 * 96); this.w = 0; }
    process(inputs) { const inp = inputs[0]; for (let i = 0; i < 128; i++) for (let c = 0; c < this.n; c++) this.buf[this.w++] = inp[c] ? inp[c][i] : 0;
