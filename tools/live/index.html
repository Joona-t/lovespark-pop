<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoveSpark Pop Live</title>
<script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
<style>
  :root { --bg:#07040d; --fg:#f6e9f2; --dim:#b9a3c9; --pink:#ff4fb0; --cyan:#3ef0ff; --line:rgba(255,79,176,.25); --panel:rgba(8,4,18,.62); }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 ui-monospace, Menlo, monospace; min-height:100vh; }
  #bg { position:fixed; inset:0; width:100vw; height:100vh; z-index:0; display:block; }
  header, #log, strudel-editor { position:relative; z-index:1; }
  header { background:var(--panel); backdrop-filter:blur(6px); }
  #log { background:var(--panel); }
  h1 { text-shadow:0 0 8px var(--pink), 0 0 18px rgba(62,240,255,.5); }
  strudel-editor .cm-editor, strudel-editor .cm-gutters, strudel-editor .cm-scroller { background:rgba(8,4,18,.58) !important; }
  strudel-editor .cm-editor { border-top:1px solid var(--line); }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; color:var(--pink); letter-spacing:.08em; }
  #status { color:var(--dim); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { background:var(--pink); color:#140a10; border:0; border-radius:6px; padding:7px 14px; font:inherit; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  #dot { width:10px; height:10px; border-radius:50%; background:#555; flex:none; }
  #dot.on { background:var(--pink); box-shadow:0 0 10px var(--pink); }
  #log { padding:6px 16px; color:var(--dim); font-size:12px; border-bottom:1px solid var(--line); max-height:4.5em; overflow:auto; }
  strudel-editor { display:block; }
  #previews { position:relative; z-index:1; background:var(--panel); border-bottom:1px solid var(--line); padding:8px 16px; }
  #previews summary { cursor:pointer; color:var(--pink); font-weight:700; letter-spacing:.06em; }
  .pv-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0; }
  .pv-name { width:72px; color:var(--cyan); font-weight:700; text-transform:uppercase; font-size:12px; }
  .pv-row button { background:rgba(255,79,176,.12); color:var(--fg); border:1px solid var(--line); font-weight:400; padding:5px 9px; font-size:12px; }
  .pv-row button.combo { background:var(--pink); color:#140a10; font-weight:700; }
  .pv-row button.playing { outline:2px solid var(--cyan); }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header>
  <span id="dot"></span><h1>LOVESPARK POP · LIVE</h1>
  <span id="status">click Start, then watch Claude cook</span>
  <button id="start">Start</button>
  <button id="stop" class="ghost">Stop</button>
</header>
<div id="log"></div>
<details id="previews" open>
  <summary>VOICE PREVIEWS · click to hear a take on its own</summary>
  <div id="pv"></div>
</details>
<strudel-editor id="ed"><!--
// waiting for the first push
--></strudel-editor>
<script>
  const ed = document.getElementById('ed'), dot = document.getElementById('dot');
  const status = document.getElementById('status'), log = document.getElementById('log');
  let started = false, latest = null, pushes = 0;
  const mirror = () => ed.editor;
  function logLine(t) { const d = document.createElement('div'); d.textContent = new Date().toLocaleTimeString() + '  ' + t; log.prepend(d); }
  // Launch quantization, like Ableton: a push waits for the next bar line.
  // "// @q 4" in the code waits for the next 4-bar phrase; "// @q 0" plays at once. Default: 1 bar.
  // The swap happens LEAD ms early, with the old pattern kept up to the bar line and the new one from it,
  // so notes that start exactly on the launch bar are scheduled in time (a 60 ms lead dropped them).
  const LEAD = 450;
  async function play(code) {
    const m = mirror(); if (!m) return;
    const q = +((code.match(/@q\s+(\d+)/) || [])[1] ?? 1);
    const sch = m.repl?.scheduler;
    const label = status.dataset.label || '';
    if (!(started && sch?.started)) {                                    // first start: nothing to stitch
      m.setCode(code);
      if (started) { await m.evaluate(); if (/@top\b/.test(code)) window.__topAt = 0; dot.classList.add('on'); }
      return;
    }
    const step = Math.max(q, 1), now = sch.now();
    let target = Math.ceil((now + 0.02) / step) * step;
    if ((target - now) / sch.cps * 1000 < LEAD + 150) target += step;      // too close: take the next line
    const wait = q > 0 ? (target - now) / sch.cps * 1000 - LEAD : 0;
    if (q > 0) status.textContent = `queued: plays in ${((wait + LEAD) / 1000).toFixed(1)} s (next ${q}-bar line)`;
    setTimeout(async () => {
      const old = sch.pattern;
      m.setCode(code);
      await m.evaluate();
      let neu = m.repl.state.pattern;
      if (neu && !m.repl.state.evalError) {
        // "// @keep" swaps in an edited arrangement at the bar the current one has reached; "// @top" starts it at bar 1.
        if (/@keep\b/.test(code) && window.__topAt != null) neu = neu.late(window.__topAt);
        else if (/@top\b/.test(code)) { neu = neu.late(target); window.__topAt = target; }
        if (q > 0 && old) m.repl.setPattern(stack(old.filterHaps(h => h.whole && h.whole.begin < target), neu.filterHaps(h => h.whole && h.whole.begin >= target)));
        else m.repl.setPattern(neu);
      }
      dot.classList.add('on'); status.textContent = label;
    }, Math.max(0, wait));
  }
  const es = new EventSource('/events');
  es.onmessage = (e) => {
    const { code, file } = JSON.parse(e.data);
    latest = code; pushes++;
    const first = (code.split('\n')[0] || '').replace(/^\/\/\s*/, '');
    status.textContent = status.dataset.label = `${file} · update ${pushes} · ${first}`;
    logLine(first || 'update');
    play(code);
    if (pushes === 1 && params.has('auto') && params.get('stems')) document.getElementById('start').click();   // headless stem capture (Chrome with --autoplay-policy=no-user-gesture-required)
  };
  es.onerror = () => { status.textContent = 'server not reachable, retrying…'; };
  // ---------- stem capture: /?stems=<name>&bars=<N> records the full mix and every bus, sample-aligned, to renders/<name>.f32 ----------
  // Same method as the club page: one worklet takes all buses as channels of a single stream (raw 32-bit float).
  // Buses by orbit: kick 9, drums 1 (the default orbit), music 2, bass 3, bell 4, other 5-8. The speakers stay on; keep the pane visible (BUG-013).
  const params = new URLSearchParams(location.search);
  const STEMS = [['master', null, 2], ['kick', 9, 1], ['drums', 1, 2], ['music', 2, 2], ['bass', 3, 1], ['bell', 4, 2], ['other', [5, 6, 7, 8], 2]];   // 'other' sums orbits 5-8 (pads, vocals) so the stems always add up to the mix
  async function captureStems(name, ctx) {
    const total = STEMS.reduce((a, x) => a + x[2], 0);
    const st = window.stems = { name, channels: total, rate: ctx.sampleRate, frames: 0, sent: 0, state: 'recording', layout: STEMS.map(([n, , c]) => n + ':' + c).join(' ') };
    const src = `class Cap extends AudioWorkletProcessor { constructor(o) { super(); this.n = o.processorOptions.n; this.buf = new Float32Array(this.n * 128 * 96); this.w = 0; }
      process(inputs) { const inp = inputs[0]; for (let i = 0; i < 128; i++) for (let c = 0; c < this.n; c++) this.buf[this.w++] = inp[c] ? inp[c][i] : 0;
        if (this.w >= this.buf.length) { this.port.postMessage(this.buf, [this.buf.buffer]); this.buf = new Float32Array(this.n * 128 * 96); this.w = 0; } return true; } }
      registerProcessor('cap', Cap);`;
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    return () => {                                     // call right after the audio graph exists
      const c = getSuperdoughAudioController(), merger = ctx.createChannelMerger(total);
      const node = new AudioWorkletNode(ctx, 'cap', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1], channelCount: total, channelCountMode: 'explicit', channelInterpretation: 'discrete', processorOptions: { n: total } });
      const sink = ctx.createGain(); sink.gain.value = 0; merger.connect(node); node.connect(sink).connect(ctx.destination);
      let ch = 0;
      for (const [, orbit, n] of STEMS) {
        const outs = orbit == null ? [c.output.destinationGain] : [orbit].flat().map((o) => c.getOrbit(o).output);
        const out = { connect: (d) => outs.forEach((x) => x.connect(d)) };   // several orbits sum into one stem
        if (n === 2) { const sp = ctx.createChannelSplitter(2); out.connect(sp); sp.connect(merger, 0, ch); sp.connect(merger, 1, ch + 1); }
        else { const mono = ctx.createGain(); mono.channelCount = 1; mono.channelCountMode = 'explicit'; out.connect(mono); mono.connect(merger, 0, ch); }
        ch += n;
      }
      let queue = Promise.resolve(), pending = [], first = true;
      const flush = () => { if (!pending.length) return; const body = new Blob(pending); pending = [];
        const headers = { 'X-Club-Save': '1' }; if (first) { headers['X-Club-First'] = '1'; first = false; }
        queue = queue.then(() => fetch('/append/' + name + '.f32', { method: 'POST', headers, body })).then((r) => { if (!r.ok) st.error = 'http ' + r.status; st.sent += body.size; }).catch((e) => { st.error = String(e); }); };
      node.port.onmessage = (e) => { if (st.state !== 'recording') return; pending.push(e.data); st.frames += e.data.length / total; if (pending.length >= 16) flush(); };
      st.stop = async () => { st.state = 'stopping'; flush(); await queue; st.state = 'saved'; };
    };
  }
  document.getElementById('start').onclick = async () => {
    const stemName = params.get('stems'), bars = +params.get('bars');
    if (stemName && bars > 0 && latest !== null && !started) {          // one pass from bar 1, then stop
      const attach = await captureStems(stemName, getAudioContext());
      // warm-up: a sample's first hit is lost while it loads, so play each one silently first (&warm=RolandTR909_bd,...)
      const warm = (params.get('warm') || '').split(',').filter(Boolean);
      await initAudio();                               // Strudel's own worklets (supersaw, ladder filter, shape) must be registered before any sound is asked for,
                                                       // or every voice that needs one stays silent for the whole pass (BUG-014)
      status.textContent = 'loading samples…';
      for (let i = 0; i < 2; i++) { await Promise.all(warm.map((w) => superdough({ s: w, gain: 0 }, getAudioContext().currentTime + .1, .05).catch(() => 0))); await new Promise((r) => setTimeout(r, 1200)); }
      started = true; await play(latest); attach();
      const sch = mirror().repl.scheduler;
      const t = setInterval(() => { status.textContent = `recording stems: bar ${Math.max(1, Math.floor(sch.now()) + 1)} of ${bars}`;
        if (sch.now() >= bars + 1.6) { clearInterval(t); window.stems.stop().then(() => { mirror().stop(); started = false; status.textContent = 'stems saved: renders/' + stemName + '.f32'; }); } }, 400);
      return;
    }
    started = true; if (latest !== null) await play(latest);
  };
  document.getElementById('stop').onclick = () => { started = false; mirror()?.stop(); dot.classList.remove('on'); };

  // Background: gradient + glyph grid, pulsing on the beat while music plays.
  (() => {
    const cv = document.getElementById('bg'), cx = cv.getContext('2d');
    const G = ' .:-=+*#%@░▒▓█▚▞◢◣◤◥ア カ サ タ ナ ハ マ ヤ ラ ワ01'.replace(/ /g, '');
    const CELL = 18; let W, H, cols, rows;
    function size() { const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); cols = Math.ceil(W / CELL); rows = Math.ceil(H / CELL); }
    addEventListener('resize', size); size();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function beat() {
      const r = ed.editor?.repl; if (!started || !r?.scheduler?.started) return { ph: 0, on: 0 };
      const c = r.scheduler.now() * 4; const ph = c - Math.floor(c);
      return { ph, on: Math.exp(-ph * 5), cyc: c };
    }
    function frame(t) {
      const s = t / 1000, b = beat();
      const g = cx.createLinearGradient(0, 0, W, H);
      const hue = 300 + 40 * Math.sin(s * 0.07);
      g.addColorStop(0, `hsl(${hue},85%,${9 + 6 * b.on}%)`);
      g.addColorStop(0.55, `hsl(${hue - 70},80%,${6 + 3 * b.on}%)`);
      g.addColorStop(1, `hsl(190,90%,${8 + 5 * b.on}%)`);
      cx.fillStyle = g; cx.fillRect(0, 0, W, H);
      cx.font = `${CELL - 4}px ui-monospace, Menlo, monospace`; cx.textBaseline = 'top';
      const scan = ((b.cyc || s * 0.5) % 1) * rows;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const n = Math.sin(x * 0.31 + s * 0.9) + Math.cos(y * 0.27 - s * 0.7) + Math.sin((x + y) * 0.11 + s * 0.3);
        const v = (n + 3) / 6; const near = Math.max(0, 1 - Math.abs(y - scan) / 3);
        const a = 0.05 + 0.22 * v * v + 0.35 * near * b.on;
        if (a < 0.07) continue;
        cx.fillStyle = (x + y) % 7 === 0 ? `rgba(62,240,255,${a})` : `rgba(255,79,176,${a})`;
        cx.fillText(G[Math.floor(v * (G.length - 1) + (reduce ? 0 : s * 2 + x)) % G.length], x * CELL, y * CELL);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  // Voice previews: one row per voice, a button per verified take, read from samples/house/scan.json.
  (async () => {
    const box = document.getElementById('pv');
    const LABEL = { six: 'six', seven: 'seven', sixseven: 'six, seven', sixsixseven: 'six six seven', closer: 'closer', feelit: 'can you feel it',
      dontstop: "don't stop", allnight: 'all night long', stay: 'stay with me', higher: 'take me higher', yeah: 'yeah', mmm: 'mmm' };
    let scan; try { scan = await (await fetch('/samples/house/scan.json')).json(); } catch { box.textContent = 'no preview pack found'; return; }
    const url = (f) => '/samples/house/' + f + '.wav';
    const hit = (f, btn) => { const a = new Audio(url(f)); if (btn) { btn.classList.add('playing'); a.onended = () => btn.classList.remove('playing'); } a.play(); };
    for (const voice of ['sultry', 'soft', 'whisper', 'belle']) {
      const row = document.createElement('div'); row.className = 'pv-row';
      const name = document.createElement('span'); name.className = 'pv-name'; name.textContent = voice; row.append(name);
      const ok = (k, t) => scan[`${voice}__${k}__s${t}`]?.ok;
      if (ok('six', 1) && ok('seven', 1)) {
        const b = document.createElement('button'); b.className = 'combo'; b.textContent = '▶ six, six, seven';
        b.onclick = () => { const beat = 60000 / 126; hit(`${voice}__six__s1`, b); setTimeout(() => hit(`${voice}__six__s1`), beat); setTimeout(() => hit(`${voice}__seven__s1`), beat * 2); };
        row.append(b);
      }
      for (const k of Object.keys(LABEL)) for (const t of [1, 2]) {
        if (!ok(k, t)) continue;
        const b = document.createElement('button'); b.textContent = `${LABEL[k]} ${t}`; b.onclick = () => hit(`${voice}__${k}__s${t}`, b); row.append(b);
      }
      box.append(row);
    }
  })();
</script>
</body>
</html>
