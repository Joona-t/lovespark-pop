<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoveSpark Pop Live</title>
<script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
<style>
  :root { --bg:#07040d; --fg:#f6e9f2; --dim:#b9a3c9; --pink:#ff4fb0; --cyan:#3ef0ff; --line:rgba(255,79,176,.25); --panel:rgba(8,4,18,.62); }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 ui-monospace, Menlo, monospace; min-height:100vh; }
  #bg { position:fixed; inset:0; width:100vw; height:100vh; z-index:0; display:block; }
  header, #log, strudel-editor { position:relative; z-index:1; }
  header { background:var(--panel); backdrop-filter:blur(6px); }
  #log { background:var(--panel); }
  h1 { text-shadow:0 0 8px var(--pink), 0 0 18px rgba(62,240,255,.5); }
  strudel-editor .cm-editor, strudel-editor .cm-gutters, strudel-editor .cm-scroller { background:rgba(8,4,18,.58) !important; }
  strudel-editor .cm-editor { border-top:1px solid var(--line); }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; color:var(--pink); letter-spacing:.08em; }
  #status { color:var(--dim); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { background:var(--pink); color:#140a10; border:0; border-radius:6px; padding:7px 14px; font:inherit; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  #dot { width:10px; height:10px; border-radius:50%; background:#555; flex:none; }
  #dot.on { background:var(--pink); box-shadow:0 0 10px var(--pink); }
  #log { padding:6px 16px; color:var(--dim); font-size:12px; border-bottom:1px solid var(--line); max-height:4.5em; overflow:auto; }
  strudel-editor { display:block; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header>
  <span id="dot"></span><h1>LOVESPARK POP · LIVE</h1>
  <span id="status">click Start, then watch Claude cook</span>
  <button id="start">Start</button>
  <button id="stop" class="ghost">Stop</button>
</header>
<div id="log"></div>
<strudel-editor id="ed"><!--
// waiting for the first push
--></strudel-editor>
<script>
  const ed = document.getElementById('ed'), dot = document.getElementById('dot');
  const status = document.getElementById('status'), log = document.getElementById('log');
  let started = false, latest = null, pushes = 0;
  const mirror = () => ed.editor;
  function logLine(t) { const d = document.createElement('div'); d.textContent = new Date().toLocaleTimeString() + '  ' + t; log.prepend(d); }
  async function play(code) {
    const m = mirror(); if (!m) return;
    m.setCode(code);
    if (started) { await m.evaluate(); dot.classList.add('on'); }
  }
  const es = new EventSource('/events');
  es.onmessage = (e) => {
    const { code, file } = JSON.parse(e.data);
    latest = code; pushes++;
    const first = (code.split('\n')[0] || '').replace(/^\/\/\s*/, '');
    status.textContent = `${file} · update ${pushes} · ${first}`;
    logLine(first || 'update');
    play(code);
  };
  es.onerror = () => { status.textContent = 'server not reachable, retrying…'; };
  document.getElementById('start').onclick = async () => { started = true; if (latest !== null) await play(latest); };
  document.getElementById('stop').onclick = () => { started = false; mirror()?.stop(); dot.classList.remove('on'); };

  // Background: gradient + glyph grid, pulsing on the beat while music plays.
  (() => {
    const cv = document.getElementById('bg'), cx = cv.getContext('2d');
    const G = ' .:-=+*#%@░▒▓█▚▞◢◣◤◥ア カ サ タ ナ ハ マ ヤ ラ ワ01'.replace(/ /g, '');
    const CELL = 18; let W, H, cols, rows;
    function size() { const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); cols = Math.ceil(W / CELL); rows = Math.ceil(H / CELL); }
    addEventListener('resize', size); size();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function beat() {
      const r = ed.editor?.repl; if (!started || !r?.scheduler?.started) return { ph: 0, on: 0 };
      const c = r.scheduler.now() * 4; const ph = c - Math.floor(c);
      return { ph, on: Math.exp(-ph * 5), cyc: c };
    }
    function frame(t) {
      const s = t / 1000, b = beat();
      const g = cx.createLinearGradient(0, 0, W, H);
      const hue = 300 + 40 * Math.sin(s * 0.07);
      g.addColorStop(0, `hsl(${hue},85%,${9 + 6 * b.on}%)`);
      g.addColorStop(0.55, `hsl(${hue - 70},80%,${6 + 3 * b.on}%)`);
      g.addColorStop(1, `hsl(190,90%,${8 + 5 * b.on}%)`);
      cx.fillStyle = g; cx.fillRect(0, 0, W, H);
      cx.font = `${CELL - 4}px ui-monospace, Menlo, monospace`; cx.textBaseline = 'top';
      const scan = ((b.cyc || s * 0.5) % 1) * rows;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const n = Math.sin(x * 0.31 + s * 0.9) + Math.cos(y * 0.27 - s * 0.7) + Math.sin((x + y) * 0.11 + s * 0.3);
        const v = (n + 3) / 6; const near = Math.max(0, 1 - Math.abs(y - scan) / 3);
        const a = 0.05 + 0.22 * v * v + 0.35 * near * b.on;
        if (a < 0.07) continue;
        cx.fillStyle = (x + y) % 7 === 0 ? `rgba(62,240,255,${a})` : `rgba(255,79,176,${a})`;
        cx.fillText(G[Math.floor(v * (G.length - 1) + (reduce ? 0 : s * 2 + x)) % G.length], x * CELL, y * CELL);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
