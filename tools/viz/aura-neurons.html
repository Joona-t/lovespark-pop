<script>

// syntax and you can do it at a rapid pace so it matches the synths", then, on the first take (branches as lines of text):
// "in our last video style thats how i want them build glyph grid style and no circular pulsing light".

// density, fine grain at an edge and code glyphs ({ } < > / 0 1 @) along a core.
// The growth comes in a burst on every 16th note, the arps' own rhythm, at a rate set by the section, with a white-hot tip
// on every growing branch. A network lives for 4 or 8 bars, then is eaten back from its tips while the next one grows over
// it. On every kick a spike runs out from each cell body along its branches; bell notes fire single neurons; the vocal stabs
// make the network flicker. Underneath, always, the lovespark.love vertical hatching (no rings of light: only the neurons

{ const a = atlas.getContext('2d'); a.scale(AK, AK); a.textBaseline = 'middle'; a.textAlign = 'center';
  for (let row = 0; row < NC; row++) { const h = row / HSTEP, i = Math.min(ANCH.length - 2, Math.floor(h)), f = h - i;
    a.fillStyle = `rgb(${ANCH[i].map((v, q) => Math.round(lerp(v, ANCH[i + 1][q], f))).join(',')})`;
    GLY.forEach((ch, g) => { a.font = g >= HAT ? '11px ui-monospace, "SF Mono", Menlo, monospace' : '700 8px Menlo, Consolas, "DejaVu Sans Mono", monospace';
      a.globalAlpha = g >= HAT ? .55 + .45 * (g - HAT + 1) / HRAMP.length : 1; a.fillText(ch, g * TW + TW / 2, row * TH + TH / 2); }); } }

  [88, 92, 3.4, 7, 11], [92, 96, 3.4, 7, 11], [96, 100, 3.4, 7, 11], [100, 104, 3.4, 7, 11], [90, 94, 3, 5, 7], [94, 98, 3, 5, 7], [98, 102, 3, 5, 7],   // drop 2: a second network, two bars out of step

// nucleus and nucleolus; five to seven dendrites that fork again and again, each fork thinning the daughters by Rall's 3/2
// rule (parent^1.5 = d1^1.5 + d2^1.5), down to twigs one glyph wide; dendritic spines, small knobs on short necks, along
// them; and one thin axon from the hillock that steers to the next neuron's body, wrapped in myelin internodes (orange
// bands) with bare nodes of Ranvier between them, ending in a few boutons. A cell keeps: when it is grown (t), how far along

const TITLE = { x: 96, y: 930, w: 260, h: 100 };
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const i = r * COLS + c, px = c * GW + GW / 2, py = r * GH + GH / 2;
  HSKIP[i] = c & 1; XC[i] = px / 9; YR[i] = py / 15; BAY[i] = (BAYER[(r & 3) * 4 + (c & 3)] / 16 - .5) * .22; RAD[i] = Math.hypot(px - SW / 2, py - SH / 2) / (SH / 2); BAND[i] = Math.min(31, Math.abs(px - SW / 2) / (SW / 2) * 30 | 0);
  const ddx = Math.max(TITLE.x - 26 - px, 0, px - (TITLE.x + TITLE.w + 26)), ddy = Math.max(TITLE.y - 78 - py, 0, py - (TITLE.y + 66)); TMASK[i] = 1 - ease(Math.hypot(ddx, ddy) / 70);
  INTITLE[i] = px > TITLE.x - 26 && px < TITLE.x + TITLE.w + 26 && py > TITLE.y - 78 && py < TITLE.y + 66 ? 1 : 0; }
const STAMP = new Int32Array(NCELL); let stampNo = 0;
const titleAlpha = (b) => ease(b / 1.5) * (1 - ease((b - 6) / 2));

function frame(b) {
  const s = song(b), spec = spectrum(b), still = !!silentOf(b), t = b * 240 / BPM, ta = COVER ? 0 : titleAlpha(b), tfull = ease(ta * 1.7);
  let E = 0; for (let q = 0; q < 32; q++) E += spec[q]; E /= 32;
  const fadeAll = (1 - .85 * ease((b - 136.6) / 1.4)) * (b < 1 ? .25 + .75 * ease(b) : 1), beat16 = Math.floor(b * 16), kAge = fr(b * 4), kOn = still ? 0 : kickOn(b);
  cx.setTransform(AK, 0, 0, AK, TX, 0); cx.globalAlpha = 1; cx.fillStyle = BG; cx.fillRect(0, 0, SW, SH);
  stampNo++; let nfig = 0, nhatch = 0, tInk = 0, total = 0;
  const shake = still ? 0 : 2.5 * s.kick + 6 * s.drop;
  for (const net of NET) { const fadeEnd = net.pb + net.prune; if (b < net.b0 || b >= fadeEnd) continue;
    const T = typed(net, b), pr = b > net.pb ? ease((Math.floor((b - net.pb) * 16) + ease(fr((b - net.pb) * 16) / .4)) / (net.prune * 16)) : 0;   // eaten back, on the 16ths too
    const P = (net.ticks + 2) * (1 - pr), old = b > net.pb, base = (old ? .55 : 1) * (still ? .55 : 1);
    const w0 = kAge * 60, w1 = (kAge + 1) * 60, w2 = (kAge + 2) * 60, I = net.I, Tt = net.T, Dd = net.D, Kd = net.Kd, Nn = net.N, Hh = net.H, Ty = net.Ty, sAge = still ? (b - silentOf(b)[0]) * 110 : -1;
    for (let q = 0; q < net.n; q++) { const tt = Tt[q]; if (tt > T || tt > P) continue;
      const i = I[q], age = T - tt, ty = Ty[q], d = Dd[q]; let k = Kd[q], hue = lerp(Hh[q], 2, ty === T_DEND ? s.warm * .35 : 0), lit = 0;
      if (ty === T_SOMA) { k = .5 + .5 * k; lit = .12 + .5 * s.kick; }                                                       // the cell body beats with the kick
      else if (ty === T_NUC) { k = .55 + .45 * k; } else if (ty === T_NUCL) { k = 1; lit = .5; }
      else if (ty === T_MYEL) k = .7 + .3 * k; else if (ty === T_SPINE || ty === T_BOUT) k = .5 + .5 * k; else k = .25 + .75 * k;
      if (!old && !still && age < 5) lit = Math.max(lit, 1 - age / 5);                                                        // just grown: the tip is white-hot
      if (old && P - tt < 3) lit = Math.max(lit, .6);                                                                         // the edge being eaten back
      if (kOn && ty !== T_MYEL) { const win = ty === T_NODE ? 16 : 7; let dw = w0 - d; if (dw < 0 || dw >= win) dw = w1 - d; if (dw < 0 || dw >= win) dw = w2 - d;
        if (dw >= 0 && dw < win) lit = Math.max(lit, (1 - dw / win) * kOn * (ty === T_NODE ? 1.4 : 1)); }                     // the spike: under the myelin it is hidden and jumps from node to node
      for (let n = 0; n < s.notes.length; n++) { if ((s.notes[n][1] + net.id) % net.K !== Nn[q] || ty === T_MYEL) continue; const dw = s.notes[n][0] * 150 - d; if (dw >= 0 && dw < 9) lit = Math.max(lit, 1 - dw / 9); }
      if (sAge >= 0 && ty !== T_MYEL) { const dw = sAge - d; if (dw >= 0 && dw < 8) lit = Math.max(lit, 1 - dw / 8); }        // the thrown stab: one slow spike through the stopped network
      if (s.chop > .25 && (ty === T_SPINE || ty === T_BOUT || hash(i, s.chopSeed, 3) < .14 * s.chop)) { lit = Math.max(lit, .75 * s.chop); if (ty !== T_SPINE && ty !== T_BOUT) hue = 4; }   // the vocal stab: the spines and boutons light
      if (s.stab > .2 && hash(i, beat16, 4) < .3 * s.stab) lit = Math.max(lit, .6);
      if (lit > 1) lit = 1;
      k = Math.min(1, k * (.78 + .38 * spec[BAND[i]]) + .45 * lit); if (lit > .3) hue = lerp(hue, hue > 4.5 ? 3.4 : 2.7, Math.min(1, lit * 1.1));   // lit: toward a warm white-gold
      let al = clamp(.35 + .7 * k) * base * fadeAll * (1 - tfull * TMASK[i]); if (lit > 0) al = Math.min(1, al + .4 * lit * fadeAll * (1 - tfull * TMASK[i])); if (COVER) al = Math.min(1, al * 1.45); if (al < .03) continue;
      const lv = Math.min(SRAMP.length - 1, Math.pow(k, .8) * SRAMP.length | 0), set = SRAMP[lv], g = SSTART[lv] + (hash(i, still ? 0 : beat16 >> 1) * set.length | 0);
      const row = clamp(Math.round(hue * HSTEP), 0, NC - 1), px = (i % COLS) * GW + GW / 2, py = Math.floor(i / COLS) * GH + GH / 2, dx = shake ? (hash(i, 21) - .5) * 2 * shake : 0, dy = shake ? (hash(i, 22) - .5) * 2 * shake : 0;
      cx.globalAlpha = al; cx.drawImage(atlas, g * TW * AK, row * TH * AK, TW * AK, TH * AK, px - TW / 2 + dx, py - TH / 2 + dy, TW, TH);
      if (STAMP[i] !== stampNo) { STAMP[i] = stampNo; nfig++; } total++; if (INTITLE[i] && al > tInk) tInk = al; } }
  // the hatching underneath, wherever no neuron sits: it drifts and sways with the music's energy (no rings of light)
  const ft = fieldTime(b), fa = (.27 + .1 * s.kick + .12 * s.drop + .06 * s.chop + .07 * s.stab) * (b < 4 ? .4 + .6 * ease(b / 4) : 1) * fadeAll * (still ? .7 : 1), sway = still ? 0 : 1.5 + 5 * E;
  for (let i = 0; i < NCELL; i++) { if (HSKIP[i] || STAMP[i] === stampNo) continue;
    let v = hatchField(XC[i] + Math.sin(YR[i] * .09 + ft * 1.7) * sway, YR[i], ft); v = v * 1.35 - .05 + BAY[i];
    const g = v >= 1 ? 6 : Math.floor(v * 8) - 1; if (g < 0) continue;
    const al = fa * (1 - tfull * TMASK[i]); cx.globalAlpha = al;
    cx.drawImage(atlas, (HAT + g) * TW * AK, 2 * HSTEP * TH * AK, TW * AK, TH * AK, (i % COLS) * GW + GW / 2 - TW / 2, Math.floor(i / COLS) * GH + GH / 2 - TH / 2, TW, TH);
    nhatch++; if (INTITLE[i] && al > tInk) tInk = al; }
  window.viz.stats = { fig: nfig / NCELL, hatch: nhatch / NCELL, titleInk: tInk, ta, chars: total };
  if (ta > 0) { cx.globalAlpha = ta * .9; cx.fillStyle = '#e6d6ad'; cx.textBaseline = 'alphabetic'; cx.textAlign = 'left';
    cx.font = '700 56px ui-monospace, "SF Mono", Menlo, monospace'; cx.fillText('A U R A', TITLE.x, TITLE.y);
    cx.globalAlpha = ta * .6; cx.font = '400 22px ui-monospace, "SF Mono", Menlo, monospace'; cx.fillText('Bvby Ash', TITLE.x + 4, TITLE.y + 40); }
  cx.globalAlpha = 1;
}

// ---------- layout check: run viz.check() in the console, or tools/viz/check_layout.mjs aura-neurons ----------
// Counts what lands on the canvas. The neurons must be there and must not fill the frame; the hatching must stay on screen;
// no glyph under the title; and the growth must keep pace: in every bar with music, the picture must change on at least
// 12 of its 16 sixteenth notes (a network that finishes early would leave the screen standing still).
function check() { const bad = [], say = (b, m) => { if (bad.length < 40) bad.push(`bar ${(b + 1).toFixed(2)}: ${m}`); }, pct = (v) => (v * 100).toFixed(1) + '%';
  for (let bar = 0; bar < BARS; bar++) { let moved = 0, prev = -1;
    for (let k = 0; k < 16; k++) { const b = bar + (k + .7) / 16; frame(b); const st = window.viz.stats;
      if (st.chars !== prev) moved++; prev = st.chars;
      if (k % 4) continue;
      if (b >= 1.5 && b < 133 && st.fig < .008) say(b, `the neurons are missing (${pct(st.fig)} of the grid)`);
      if (st.fig > .5) say(b, `the neurons fill the frame (${pct(st.fig)})`);
      if (b < 137 && st.hatch < .03) say(b, `the hatching has left the screen (${pct(st.hatch)})`);
      if (st.ta > .6 && st.titleInk > .2) say(b, `glyphs are painted under the title (alpha ${st.titleInk.toFixed(2)})`); }
    if (bar < 134 && !SILENT.some(([a]) => a === bar) && moved < 12) say(bar, `the growth stalls: the picture changed on only ${moved} of 16 sixteenths`); }
  return bad; }

const go = document.getElementById('go');
window.viz = { BPM, BARS, TAIL, frame, song, check, NET, stats: null, shot: (bar, q = .93) => { frame(bar); return cv.toDataURL('image/jpeg', q); }, ready: false };
fetch('aura-festival-spectrum.json').then((r) => r.json()).then((j) => {
    SPEC = { fps: j.fps, frames: j.frames, d: Uint8Array.from(atob(j.data), (ch) => ch.charCodeAt(0)) };
    CUM = new Float32Array(SPEC.frames); for (let i = 1; i < SPEC.frames; i++) { const b = (i / SPEC.fps - OFF) * BPM / 240;
      CUM[i] = CUM[i - 1] + (silentOf(b) ? 0 : (.8 + 4.5 * energy(i)) / SPEC.fps); } })
  .catch((e) => console.error('no spectrum file: the field will not follow the music', e))
  .finally(() => {
    window.viz.ready = true;
    if (QS.has('bar')) { go.remove(); frame(+QS.get('bar')); return; }
    frame(30);
    go.onclick = () => {
      go.remove();
      const audio = new Audio(QS.get('audio') || '/renders/aura-festival-r1-master.mp3'); window.viz.audio = audio;
      const from = +QS.get('from') || 0; let t0 = null;
      audio.addEventListener('loadedmetadata', () => { audio.currentTime = from * 240 / BPM + OFF; audio.play(); });
      audio.addEventListener('error', () => { t0 = performance.now() - from * 240 / BPM * 1000; });
      const loop = (t) => { const sx = t0 === null ? audio.currentTime - OFF : (t - t0) / 1000; frame(Math.min(sx * BPM / 240, BARS - .001)); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    };
  });
</script>
