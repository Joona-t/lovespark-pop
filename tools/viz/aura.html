<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura · sand that sings</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1114; overflow: hidden; }
  canvas { position: fixed; inset: 0; margin: auto; aspect-ratio: 16 / 9; width: 100vw; height: auto; max-height: 100vh; display: block; }
  @media (min-aspect-ratio: 16/9) { canvas { width: auto; height: 100vh; } }
  #go { position: fixed; inset: 0; margin: auto; width: 9rem; height: 3rem; font: 700 1rem ui-monospace, Menlo, monospace; letter-spacing: .25em;
        color: #e6d6ad; background: #16191d; border: 2px solid #e6d6ad; border-radius: 4px; cursor: pointer; }
  #go:hover, #go:focus-visible { background: #22262c; outline: 2px solid #e6d6ad; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080" aria-label="Aura visualiser: glyph sand on a moving round dark plate gathers into ring-and-spoke patterns set by each chord, dissolving into cells of dots between figures, over a drifting field of vertical hatching glyphs"></canvas>
<button id="go">PLAY</button>
<script>
// Aura · the music video. Sand that sings: glyph sand on a round vibrating plate (a Chladni plate seen from above).
// The sand gathers on the still lines of the vibration, and on a round plate those lines are rings and spokes, so the
// sand draws a mandala. Behind the plate: the lovespark.love glyph field (vertical hatching strokes, value noise stretched
// into strands, a 4x4 Bayer threshold; from Joona-t.github.io assets/glyph-field.js, basalt ink).
// Every frame is a pure function of the bar position (no state, no Math.random): ?bar=N holds a frame, PLAY runs on the
// master's clock, window.viz.shot(bar) feeds tools/viz/render_viz.mjs.
// r9, the layered-arps cut (130 bars, ~4:04; the John Summit drop from r8). Joona: "make the visualizer go insane ... have the circle moving, but have the glyph
// grid moving as well ... in between shape transitions, it goes into little dots ... that cellular form ... then boom, boom, boom".
//   cells    every chord change (2 bars): the figure dissolves into cells of dots over the last beat and a half, then three
//            booms on beats 1, 2, 3 of the new chord snap it, a third at a time, into the new figure
//   plate    the plate travels a slow figure-of-eight, bounces on the kick, is shoved on every boom, slams over at the drop
//   field    drifts with the music's energy, sways with it, and every kick and boom sends a ring of light out from the plate
//   chop     Summit's vocal hook (full, build, drop; not the lift) pops the cells on every stab
//   lift     the borrowed E major (bars 9-10 of every 16) adds a ring and warms the sand from pale steel to gold
//   bell     every bell note rings a circle out from the centre (bloom, both breakdowns)
//   silence  bar 80 (the build's last bar): the sand lies flat, one thrown vocal stab ripples across it; the drop flings it
//            into cells and booms it into the biggest figure of the piece
//   audio    the master's spectrum (tools/viz/analyze.py) lights the sand by radius, bass at the centre, treble at the rim
const BPM = 128, BARS = 130, TAIL = 0;                    // r9 ends on its own 2-bar ring-out, so no tail
const QS = new URLSearchParams(location.search);                      // one master since r9 (it replaced both A and B)
const OFF = 0;                                                        // the masters start on bar 1 (mix_live.py trims the chain delay)
const BG = '#16191d', PLATE = '#1c2026', FIELD_INK = '#e6d6ad';
const COOL = [207, 216, 224], WARM = [233, 201, 160];                 // the sand: pale steel, gold at the lift
const CX = 960, CY = 540, PR = 400, SR = 360;                         // plate rim radius; the sand's home radius
const cv = document.getElementById('cv'), cx = cv.getContext('2d');

const TAU = Math.PI * 2, fr = (v) => v - Math.floor(v);
const clamp = (v, a = 0, z = 1) => v < a ? a : v > z ? z : v;
const ease = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const lerp = (a, z, t) => a + (z - a) * t;
const within = (b, a, z) => b >= a && b < z;
function hash(a, b = 0, c = 0) { let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1274126177)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

// ---------- the song, as data (patterns/12-aura.strudel.js, r9, bars counted from 0) ----------
// [start, end, name, cutoff lo, cutoff hi] from arrange(): the pluck's filter sweep, section by section
const SECTIONS = [[0, 8, 'air', 300, 900], [8, 16, 'bloom', 900, 1600], [16, 24, 'pulse', 1600, 2000], [24, 40, 'groove', 1900, 2400],
  [40, 56, 'full', 2400, 3000], [56, 64, 'breakdown', 2600, 1000], [64, 72, 'breakdown', 1600, 2600], [72, 80, 'build', 900, 4200],
  [80, 96, 'drop', 3200, 4200], [96, 104, 'lift', 3800, 4400], [104, 128, 'outro', 2400, 300], [128, 130, 'ringout', 300, 300]];
const SPOKES = [4, 6, 5, 3, 4, 6, 5, 7];        // one per chord: Em9 · Cmaj9 · Gmaj9 · D/F# | E add9 · Cmaj9 · Am9 · Bsus4->B7
const TUNE = [[0,0,71],[0,3,78],[0,6,76],[1,0,74],[1,6,76],[1,7,78],[2,0,79],[2,3,76],[2,6,74],[3,0,76],[4,0,74],[4,3,71],[4,6,74],
  [5,0,78],[5,4,79],[5,6,78],[6,0,76],[6,3,74],[6,6,69],[7,0,66],[8,0,80],[8,3,78],[8,6,76],[9,0,83],[9,4,80],[10,0,79],[10,3,76],
  [10,6,71],[11,0,74],[11,4,76],[12,0,72],[12,3,76],[12,6,81],[13,0,79],[13,4,76],[13,6,71],[14,0,69],[14,3,71],[14,6,76],[15,0,75],[15,4,78]];  // [bar in 16, 8th step, midi]
const SILENT = [79, 80];                        // build's mask "<1!7 0>": the last bar, only the thrown stab on its downbeat
const CHOP = [[2, 5, 8, 12], [2, 5, 10, 13]];   // the vocal hook's 16ths, alternating bars: "<[~ ~ x ~ ~ x ~ ~ x ~ ~ ~ x ~ ~ ~] [~ ~ x ~ ~ x ~ ~ ~ ~ x ~ ~ x ~ ~]>"
const sec = (b) => SECTIONS.find(([a, z]) => b >= a && b < z) || SECTIONS[SECTIONS.length - 1];
function light(b) { const [a, z, , lo, hi] = sec(b); return clamp(Math.log(lerp(lo, hi, clamp((b - a) / (z - a))) / 300) / Math.log(4400 / 300)); }
// rings by section; the build climbs a ring per bar; the outro gives them back
function rings(b) { const n = sec(b)[2];
  if (n === 'build') return 2 + Math.min(5, Math.floor(b - 72));
  if (n === 'outro') return Math.max(1, 5 - Math.floor((b - 104) / 4.8));
  return { air: 1, bloom: 2, pulse: 2, groove: 3, full: 4, breakdown: 3, drop: 5, lift: 6, ringout: 1 }[n]; }
// how much sand is on the plate (0..1): a dusting in the air, all of it from the pulse on, gone by the end
function amount(b) { if (b < 8) return .3 + .35 * ease(b / 8); if (b < 16) return .65 + .35 * ease((b - 8) / 8);

const kickOn = (b) => within(b, 16, 56) || within(b, 80, 104) ? 1 : within(b, 104, 112) ? .5 : 0;   // no kick in the breakdowns or the build (Summit takes the low end away)
const silent = (b) => within(b, SILENT[0], SILENT[1]);
// the vocal hook: how loud it is here, and how long since its last stab (in 16ths)
function chopGain(b) { return within(b, 48, 56) || within(b, 80, 96) ? 1 : within(b, 72, 79) ? .45 + .55 * (b - 72) / 7 : 0; }
function chopNow(b) { let best = 0;
  for (const bar of [Math.floor(b), Math.floor(b) - 1]) { const g = chopGain(bar); if (!g) continue;
    for (const st of CHOP[((bar % 2) + 2) % 2]) { const age = (b - bar - st / 16) * 16; if (age >= 0 && age < 6) best = Math.max(best, g * Math.exp(-age * .8)); } }

  return best; }
// the lift: warmth 1 on the borrowed E major (chord 4 of 8), easing back to steel by the turn home
function warmth(b) { const c = fr(b / 16) * 8; return c < 4 ? 0 : c < 6 ? ease((c - 4) * 3) : 1 - ease((c - 6) / 2) * .85; }
function song(b) {
  const beat = fr(b * 4), ci = Math.floor(b / 2) % 8;
  const s = { b, ci, L: light(b), kick: silent(b) ? 0 : kickOn(b) * Math.exp(-beat * 6), warm: warmth(b), amt: amount(b), chop: chopNow(b),
    roll: within(b, 72, 79) ? ease((b - 72) / 7) : 0, drop: b >= 80 && b < 82 ? Math.exp(-(b - 80) * 2.2) : 0, notes: [] };

  const loop = Math.floor(b / 16) * 16;
  for (const base of [loop - 16, loop]) for (const [br, st, m] of TUNE) { const t0 = base + br + st / 8, age = b - t0;
    if (age < 0 || age >= 2) continue;
    const g = within(t0, 8, 16) ? 1 : within(t0, 56, 72) ? .9 : 0;
    if (g) s.notes.push([age, m, g]); }

  return s;
}
// the figure: rings x spokes, plus a finer second mode that grows with the energy (full, build, drop, lift)
function mode(b) { const ci = Math.floor(b / 2) % 8, n = rings(b) + (ci >= 4 && ci <= 5 ? 1 : 0);
  const n2 = sec(b)[2], c2 = { full: .15, build: .15, drop: .35, lift: .4 }[n2] || 0;
  return { n, m: SPOKES[ci], c2 }; }
function fig(md, r, a) { return Math.cos(md.n * Math.PI * r) * Math.cos(md.m * a) + md.c2 * Math.cos((md.n + 2) * Math.PI * r) * Math.cos(2 * md.m * a); }
// the transition: c = how far the sand has gone to cells (0 figure, 1 cells), tm = how much of the new figure is built,
// bm = the boom's impulse. Cells form over the chord's last beat and a half; three booms on beats 1-3 rebuild the figure.
function cells(b) { const c0 = Math.floor(b / 2) * 2, p = (b - c0) * 4;
  let tm = 1, bm = 0;
  if (p < 3) { tm = (Math.floor(p) + ease(fr(p) / .2)) / 3; bm = Math.exp(-fr(p) * 9); }
  let c = 1 - tm; if (p >= 6.5) c = Math.max(c, ease((p - 6.5) / 1));
  const soft = kickOn(b) || chopGain(b) || within(b, 80, 104) ? 1 : .55;          // no drums yet: the booms are softer
  return { c, tm, bm: bm * soft, p }; }
// one cell's state: the cells split into three groups, and each boom snaps one group whole into the figure (no half-formed
// mush); they dissolve again one by one over the chord's last beat and a half
function cellC(p, ci) { const g = Math.floor(hash(ci, 9) * 3);
  if (p < 3) return p < g ? 1 : 1 - ease((p - g) / .15);
  return p >= 6.5 ? ease((p - 6.6 - .6 * hash(ci, 10)) / .3) : 0; }

// the most any grain can move from its home (px), one function for the frame and the check
function jump(b) { const s = song(b), cs = cells(b);
  return 7 * s.kick + 5 * s.roll * (1 + Math.sin(b * TAU * 8) * .5) + 12 * cs.bm + 16 * s.drop + 6 * s.chop; }
// where the plate is: a slow figure-of-eight, a bounce on the kick, a shove on every boom, frozen in the silence
function plate(b) { if (silent(b)) b = SILENT[0];
  const s = song(b), cs = cells(b), n = sec(b)[2];
  const A = ease((b - 6) / 6) * ({ air: .35, bloom: .55, breakdown: .6 }[n] ?? 1) * (n === 'outro' || n === 'ringout' ? 1 - .8 * ease((b - 112) / 14) : 1);
  const sa = hash(Math.floor(b / 2), 91) * TAU;
  const ox = A * (250 * Math.sin(b * TAU / 16) + 40 * Math.sin(b * TAU / 5.3) + 24 * cs.bm * Math.cos(sa));
  const oy = A * (52 * Math.sin(b * TAU / 10.7 + 1) + 14 * cs.bm * Math.sin(sa) - 9 * s.kick);
  return { x: CX + ox, y: CY + oy, sc: 1 + .025 * s.kick + .035 * cs.bm * A + .03 * s.drop }; }

// ---------- the master's spectrum: 32 bands, 30 frames a second ----------
let SPEC = null, CUM = null;
function spectrum(b) { const out = new Float32Array(32); if (!SPEC) return out;
  const f = clamp((b * 240 / BPM + OFF) * SPEC.fps, 0, SPEC.frames - 1.001), i = Math.floor(f), t = f - i;
  for (let k = 0; k < 32; k++) out[k] = Math.pow(lerp(SPEC.d[i * 32 + k], SPEC.d[(i + 1) * 32 + k], t) / 255, 1.6);
  return out; }
function energy(i) { let e = 0; for (let k = 0; k < 32; k++) e += SPEC.d[i * 32 + k]; return e / (32 * 255); }
// the field's clock: it drifts faster when the music is loud, and stops in the silence (precomputed, so still pure)
function fieldTime(b) { const sx = b * 240 / BPM; if (!CUM) return sx * .8;
  const f = clamp((sx + OFF) * SPEC.fps, 0, SPEC.frames - 1.001), i = Math.floor(f); return lerp(CUM[i], CUM[i + 1], f - i); }

// ---------- the field (lovespark.love, basalt): vertical hatching, strands of ink ----------
const HRAMP = [' ', '╷', '┆', '╎', '¦', '│', '┃', '║'], BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const FW = 9, FH = 15, FC = Math.ceil(1920 / FW), FR = Math.ceil(1080 / FH);
function vhash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

  const a = vhash(xi, yi), b = vhash(xi + 1, yi), c = vhash(xi, yi + 1), d = vhash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }

const smooth = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0)); return k * k * (3 - 2 * k); };
const fatlas = document.createElement('canvas'); fatlas.width = FW * HRAMP.length; fatlas.height = FH;
{ const a = fatlas.getContext('2d'); a.font = '13px ui-monospace, "SF Mono", Menlo, monospace'; a.textAlign = 'center'; a.textBaseline = 'middle'; a.fillStyle = FIELD_INK;
  for (let i = 1; i < HRAMP.length; i++) { a.globalAlpha = .55 + .45 * i / (HRAMP.length - 1); a.fillText(HRAMP[i], i * FW + FW / 2, FH / 2); } }

// ---------- the sand: glyphs from fine grain to heaped, code glyphs where it is thickest; dots for the cells ----------
const SRAMP = ['.', '·:', ':;', "-'", '=+', '*+', '#x', '%&', '0{}', '1<>/@'];
const GW = 6, GH = 9, SGL = []; SRAMP.forEach((set) => [...set].forEach((ch) => SGL.push(ch)));
const SSTART = []; { let n = 0; SRAMP.forEach((set) => { SSTART.push(n); n += set.length; }); }
const DOT = SGL.length; SGL.push('·', '•', '●');                     // cell interior, membrane, nucleus
const satlas = document.createElement('canvas'); satlas.width = SGL.length * 10; satlas.height = 12; const sa = satlas.getContext('2d');
let satlasKey = '';
function sandAtlas(rgb) { const key = rgb.join(); if (key === satlasKey) return; satlasKey = key;
  sa.clearRect(0, 0, satlas.width, 12); sa.font = '700 8px Menlo, Consolas, "DejaVu Sans Mono", monospace'; sa.textBaseline = 'middle'; sa.textAlign = 'center';
  sa.fillStyle = `rgb(${rgb.join(',')})`; SGL.forEach((ch, i) => sa.fillText(ch, i * 10 + 5, 6)); }
const GRAINS = []; for (let y = CY - SR; y <= CY + SR; y += GH) for (let x = CX - SR; x <= CX + SR; x += GW) {
  const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy) / SR; if (r <= 1) GRAINS.push([x, y, r, Math.atan2(dy, dx), GRAINS.length]); }
// the cells: a jittered hex lattice over the plate; every grain belongs to its nearest centre
const CS = 46, CELLC = [];
for (let row = 0, y = -SR; y <= SR; y += CS * .866, row++) for (let x = -SR + (row % 2) * CS / 2; x <= SR; x += CS) {
  const jx = x + (hash(row, Math.round(x), 81) - .5) * CS * .36, jy = y + (hash(row, Math.round(x), 82) - .5) * CS * .36;
  if (Math.hypot(jx, jy) <= SR + CS * .3) CELLC.push([jx, jy]); }
const GCELL = new Int32Array(GRAINS.length), CRAD = new Float32Array(CELLC.length).fill(1);
for (const [x, y, , , id] of GRAINS) { let bi = 0, bd = 1e9;
  for (let i = 0; i < CELLC.length; i++) { const d = (x - CX - CELLC[i][0]) ** 2 + (y - CY - CELLC[i][1]) ** 2; if (d < bd) { bd = d; bi = i; } }
  GCELL[id] = bi; CRAD[bi] = Math.max(CRAD[bi], Math.sqrt(bd)); }

// how far the figure's own lattice pulls apart (0 = whole figure, 1 = about 20 px gaps, more at the drop)
function breakAmt(b, s, cs) { const n = sec(b)[2];
  let v = .55 * s.kick + 2.2 * s.drop + .9 * s.roll + .7 * s.chop + .6 * cs.bm;
  if (n === 'air' || n === 'bloom') v += .25 + .2 * Math.sin(b * Math.PI / 2);               // no drums yet: the cells breathe
  if (n === 'breakdown') v += .55 + .35 * Math.sin(b * Math.PI / 4);                        // the cells float apart while the bell has the room

function frame(b) {

  const fade = 1 - ease((b - 128) / 2);                               // the ring-out fades to the plate alone

  // the field: thins around the plate wherever it is, sways with the energy, rings of light run out on the kick and the booms

  const kAge = fr(b * 4), kStr = still ? 0 : kickOn(b) * (1 - kAge) * .5, kR = PRs + 30 + 420 * kAge;

  const twist = (.35 + .6 * E) * Math.sin(b * Math.PI / 4) * (flat ? 0 : 1);                  // rings turn against each other: spokes curl into spirals

  const sharp = 1.6 + 2.6 * s.L, j = jump(b), beat16 = Math.floor(b * 16);

    const kFlat = .16 + .06 * hash(id, 11), loose = hash(id, 12) < .14 ? .11 + .07 * hash(id, 13) : 0;   // the even layer of the silence; loose grains everywhere

    // the cell this grain belongs to: interior a faint dot, membrane a dot, nucleus a bold one

    const part = dn < .2 ? 2 : dn > .7 ? 1 : 0, kCell = part === 2 ? .95 : part === 1 ? .62 : hash(id, 61) < .3 ? .32 : 0;

    let px = x + (hash(id, 31) - .5) * 4, py = y + (hash(id, 32) - .5) * 4;   // a fixed jitter: grains, not a grid
    if (!flat) {

      // the figure's own lattice (ring bands x spoke halves) breaks into pieces that pull apart and re-form
      const n = mdB.n, m2 = mdB.m * 2, ib = Math.min(n - 1, Math.floor(r * n)), is = Math.floor(fr((a + rot) / TAU + 1) * m2), ch = hash(ib, is, 77);
      const ca = (is + .5) / m2 * TAU - rot, crr = (ib + .5) / n, out = brk * 22 * (.45 + ch) * (.35 + crr);
      px += Math.cos(ca) * out - Math.sin(ca) * out * .35 * (ch - .5) + brk * 5 * (hash(id, 24) - .5);
      py += Math.sin(ca) * out + Math.cos(ca) * out * .35 * (ch - .5) + brk * 5 * (hash(id, 25) - .5);
      // the cells: each one gathers its grains into a round clump that breathes, turning with the plate
      if (cc > 0) { const sh = .48 + .08 * Math.sin(t * 4 + hash(ci, 3) * TAU) - .1 * s.chop, cd = Math.hypot(ccx, ccy) / SR;
        const wx = ccx * cr0 - ccy * sr0, wy = ccx * sr0 + ccy * cr0, push = 1 + (10 * cs.bm + 8 * s.chop) * (.3 + cd) / 40;
        const qx = CX + wx * push + (ox * cr0 - oy * sr0) * sh + Math.sin(t * 1.3 + hash(ci, 4) * TAU) * 5;

}
const TITLE = { x: 96, y: 930, w: 260, h: 100 };                     // box: x..x+w, y-56..y+44
const titleAlpha = (b) => ease(b / 1.5) * (1 - ease((b - 6) / 2));

// ---------- layout check: run viz.check() in the console, or tools/viz/check_layout.mjs aura ----------
// Every 8th of a bar the page draws the frame and measures where every grain actually landed: none may cross the rim,
// the moving plate stays in the frame, and while the title shows it stays clear of the plate.
function check(step = 1 / 8) { const bad = [], say = (b, m) => { if (bad.length < 40) bad.push(`bar ${(b + 1).toFixed(3)}: ${m}`); };
  const tx0 = TITLE.x, tx1 = TITLE.x + TITLE.w, ty0 = TITLE.y - 56, ty1 = TITLE.y + 44;
  if (tx0 < 8 || ty1 > 1072) say(0, 'the title leaves the frame');
  for (let b = 0; b < BARS + TAIL; b += step) { frame(b); const P = window.viz.plateNow, R = PR * P.sc;
    const m = window.viz.maxR + 5; if (m > PR - 3) say(b, `sand leaves the plate: a grain at ${m.toFixed(0)} px > rim ${PR - 3}`);
    if (P.x - R < 8 || P.x + R > 1912 || P.y - R < 8 || P.y + R > 1072) say(b, `the plate leaves the frame (${P.x.toFixed(0)}, ${P.y.toFixed(0)}, r ${R.toFixed(0)})`);
    if (titleAlpha(b) > 0) { const nx = clamp(P.x, tx0, tx1), ny = clamp(P.y, ty0, ty1), g = Math.hypot(nx - P.x, ny - P.y) - R; if (g < 40) say(b, `the title touches the plate (gap ${g.toFixed(0)} px)`); } }
  return bad; }

// ---------- clocks: ?bar=N holds one frame; otherwise the master plays and the picture follows its time ----------
const go = document.getElementById('go');
window.viz = { BPM, BARS, TAIL, frame, song, mode, jump, cells, plate, check, shot: (bar, q = .93) => { frame(bar); return cv.toDataURL('image/jpeg', q); }, ready: false };
fetch('aura-spectrum.json').then((r) => r.json()).then((j) => {
    SPEC = { fps: j.fps, frames: j.frames, d: Uint8Array.from(atob(j.data), (ch) => ch.charCodeAt(0)) };
    CUM = new Float32Array(SPEC.frames); for (let i = 1; i < SPEC.frames; i++) { const b = (i / SPEC.fps - OFF) * BPM / 240;
      CUM[i] = CUM[i - 1] + (silent(b) ? 0 : (.8 + 4.5 * energy(i)) / SPEC.fps); } })
  .catch((e) => console.error('no spectrum file: the sand will not follow the music', e))
  .finally(() => {
    window.viz.ready = true;
    if (QS.has('bar')) { go.remove(); frame(+QS.get('bar')); return; }
    frame(3);
    go.onclick = () => {
      go.remove();
      const audio = new Audio(QS.get('audio') || '/renders/aura-r9-master.mp3'); window.viz.audio = audio;
      const from = +QS.get('from') || 0; let t0 = null;
      audio.addEventListener('loadedmetadata', () => { audio.currentTime = from * 240 / BPM + OFF; audio.play(); });
      audio.addEventListener('error', () => { t0 = performance.now() - from * 240 / BPM * 1000; });
      const loop = (t) => { const sx = t0 === null ? audio.currentTime - OFF : (t - t0) / 1000; frame(Math.min(sx * BPM / 240, BARS + TAIL)); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    };
  });
</script>
