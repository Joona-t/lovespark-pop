<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow Light · ink garden</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1c22; overflow: hidden; }
  canvas { position: fixed; inset: 0; margin: auto; aspect-ratio: 16 / 9; width: 100vw; height: auto; max-height: 100vh; display: block; }
  @media (min-aspect-ratio: 16/9) { canvas { width: auto; height: 100vh; } }
  #go { position: fixed; inset: 0; margin: auto; width: 9rem; height: 3rem; font: 700 1rem ui-monospace, Menlo, monospace; letter-spacing: .25em;
        color: #0e0805; background: #e8ddc8; border: 2px solid #0e0805; border-radius: 4px; cursor: pointer; }
  #go:hover, #go:focus-visible { background: #f4ecdc; outline: 2px solid #e8ddc8; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080" aria-label="Slow Light visualiser: a garden drawn in charcoal glyphs on cream paper grows under a sun whose rays are the music's spectrum"></canvas>
<button id="go">PLAY</button>
<script>
// Slow Light · the music video. Charcoal glyphs on cream paper, the glyph-grid-studio way: a scene is painted into a
// small buffer (how much ink, 0..1), then every cell of a 480 x 180 grid becomes one glyph whose density and opacity
// follow the ink. Every frame is a pure function of the bar position (no state, no Math.random), so the live page and
// a frame-by-frame video render show the same picture.
// ONE picture for the whole song, nothing cuts or crossfades:
//   above   the sun: its rays are the spectrum of the master (bass at the bottom, treble at the top, 32 bands a side),
//           so it opens as the pluck's filter opens and it beats with the kick
//   below   a garden that only ever grows: eleven plants, each in its own lane (nothing overlaps), short under the sun
//           and tall at the sides; roots grow down as the stems grow up; buds form in the build and open one by one;
//           each melody note rings from the flower whose lane matches its pitch
//   outro   stardust: the ink lifts off the paper (the studio's dispersal)
const BPM = 128, BARS = 152, TAIL = 1.5;
const C = 480, R = 180, CW = 4, CH = 6;                               // grid and cell size in px (1920 x 1080)
const PAPER = '#E8DDC8', INK = '#0E0805';                             // glyph-grid-studio's cream-paper palette
const GROUND = 900, SUN_X = 960, SUN_Y = 310, LANE = 172;
const QS = new URLSearchParams(location.search), K = clamp_(+QS.get('scale') || 1), COVER = QS.has('cover');   // ?scale=2.7778 draws the glyphs sharp at 3000 px high; ?cover keeps the five middle lanes (a square crop)
function clamp_(v) { return v < 1 ? 1 : v > 4 ? 4 : v; }
const cv = document.getElementById('cv'); cv.width = Math.round(1920 * K); cv.height = Math.round(1080 * K); const cx = cv.getContext('2d');
const big = document.createElement('canvas'); big.width = C * 2; big.height = R * 2; const p = big.getContext('2d');           // the painting
const small = document.createElement('canvas'); small.width = C; small.height = R; const sm = small.getContext('2d', { willReadFrequently: true });

// ---------- the song, as data (from patterns/11-slow-light.strudel.js) ----------
const ROWS = [[0, 8, 320, 480], [8, 16, 480, 650], [16, 32, 650, 1300], [32, 48, 1300, 2400], [48, 64, 1500, 700], [64, 72, 700, 3200],
  [72, 104, 3200, 3800], [104, 120, 2600, 4200], [120, 136, 4200, 3400], [136, 144, 3400, 1200], [144, 152, 1200, 320]];
const TUNE = [[0, 0, 73], [0, 3, 71], [0, 6, 69], [1, 0, 68], [1, 6, 64], [2, 0, 66], [2, 3, 69], [2, 6, 73], [3, 0, 76], [3, 4, 73],
  [4, 0, 71], [4, 3, 73], [4, 6, 76], [5, 0, 80], [5, 4, 76], [6, 0, 69], [6, 3, 71], [6, 6, 73], [7, 0, 71], [7, 4, 68]];   // [bar in the 8-bar loop, 8th step, midi]
const within = (b, a, z) => b >= a && b < z, TAU = Math.PI * 2;
const clamp = (v, a = 0, z = 1) => v < a ? a : v > z ? z : v;
const ease = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const lerp = (a, z, t) => a + (z - a) * t;
const fr = (v) => v - Math.floor(v);
function hash(a, b = 0, c = 0) { let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1274126177)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function light(b) {                                                   // 0..1: the pluck's cutoff on a log scale
  for (const [a, z, lo, hi] of ROWS) if (b < z) return clamp(Math.log((lo + (hi - lo) * clamp((b - a) / (z - a))) / 320) / Math.log(4200 / 320));
  return 0;
}
function song(b) {
  const beat = fr(b * 4), kickOn = within(b, 8, 48) || within(b, 72, 148);
  const s = { b, L: light(b), kick: kickOn ? Math.exp(-beat * 6) : 0,
    bass: (within(b, 16, 48) || within(b, 72, 144)) ? Math.exp(-fr(b * 4 + .5) * 4) : 0, root: Math.floor(b / 2) % 4,
    pluck: b < BARS ? [.5, .28, .38, .28][Math.floor(b * 16) % 4] * 2 * Math.exp(-fr(b * 16) * 2.5) : 0,
    lead: within(b, 72, 104) || within(b, 120, 136), notes: [] };
  if (within(b, 48, 105.5) || within(b, 120, 137.5)) { const loop = Math.floor(b / 8) * 8;      // melody notes sounding now: [age in bars, midi]
    for (const base of [loop - 8, loop]) TUNE.forEach(([br, st, m]) => { const t0 = base + br + st / 8, age = b - t0;
      if (age >= 0 && age < .75 && (within(t0, 48, 104) || within(t0, 120, 136))) s.notes.push([age, m]); }); }
  return s;
}
// the spectrum of the master (tools/viz/analyze.py): 32 bands, 30 frames a second
let SPEC = null;
function spectrum(b) { const out = new Float32Array(32); if (!SPEC) return out;
  const f = clamp(b * 240 / BPM * SPEC.fps, 0, SPEC.frames - 1.001), i = Math.floor(f), t = f - i;
  for (let k = 0; k < 32; k++) out[k] = Math.pow(lerp(SPEC.d[i * 32 + k], SPEC.d[(i + 1) * 32 + k], t) / 255, 1.9);
  return out; }

// ---------- painting tools: everything is drawn in 1920 x 1080 coordinates, as an amount of ink 0..1 ----------
const ink = (v) => { const g = clamp(v) * 255 | 0; return `rgb(${g},${g},${g})`; };
function petal(x, y, ang, len, wid, base = .55, tip = .16, edge = .9) {       // a petal from (x,y) pointing along ang; shaded base -> tip, darker rim, one vein
  if (len < 5) return;
  p.save(); p.translate(x, y); p.rotate(ang);
  p.beginPath(); p.moveTo(0, 0); p.bezierCurveTo(len * .3, -wid, len * .8, -wid * .9, len, 0); p.bezierCurveTo(len * .8, wid * .9, len * .3, wid, 0, 0);
  const g = p.createLinearGradient(0, 0, len, 0); g.addColorStop(0, ink(base)); g.addColorStop(.75, ink(tip)); g.addColorStop(1, ink(tip + .1));
  p.fillStyle = g; p.fill(); p.strokeStyle = ink(edge); p.lineWidth = 3.5; p.stroke();
  if (len > 30) { p.beginPath(); p.moveTo(len * .1, 0); p.lineTo(len * .68, 0); p.strokeStyle = ink(base * .85); p.lineWidth = 2.5; p.stroke(); }
  p.restore();
}
function disc(x, y, r, v) { if (r <= 0) return; p.beginPath(); p.arc(x, y, r, 0, TAU); p.fillStyle = ink(v); p.fill(); }
// three kinds of flower head; r is the most any part reaches from (x,y), so a head never leaves its lane
function head(type, x, y, up, r, open, rot, seed) {
  if (type === 0) {                                                                         // seen from above: rings of petals unfolding from the heart
    for (let k = 0; k < 3; k++) { const n = [11, 9, 6][k], o = ease(open * 1.5 - k * .22), len = r * [1, .72, .45][k] * (.2 + .8 * o);
      for (let j = 0; j < n; j++) petal(x, y, rot + k * 2.4 + j * TAU / n + (hash(seed, k, j) - .5) * .1, len, len * (.2 + .16 * o), .6 - k * .05, .13 + k * .05); }
    disc(x, y, r * .17, .95); }
  else if (type === 1) { const n = 9, spread = .3 + open * 3.3;                             // seen from the side: a fan that opens
    for (let j = 0; j < n; j++) petal(x, y, up + (j / (n - 1) - .5) * spread, r * (.55 + .45 * open), r * .17, .6, .16); disc(x, y, r * .15, .92); }
  else { for (const d of [-1, 1, 0]) petal(x, y + r * .25, up + d * (.12 + open * .55), r * (d ? 1.05 : 1.2), r * (.3 + .1 * open), .62, d ? .2 : .13); }   // a cup: three large petals
}
// eleven lanes, short under the sun and tall at the sides. [full height, first bar, head kind, head size, bar its flower opens]
const PLANTS = [[730, 7, 1, 62, 60], [660, 10, 0, 64, 44], [600, 5, 2, 58, 66], [540, 9, 0, 66, 52], [275, 3, 1, 58, 38], [230, 1, 0, 62, 34],
                [275, 6, 2, 56, 56], [540, 11, 1, 64, 48], [600, 4, 0, 64, 63], [660, 12, 2, 60, 41], [730, 8, 0, 66, 69]];
const growth = (b, t0) => { const u = b - t0; if (u <= 0) return 0;                          // never stops: over half in the first 26 bars, slower through it, the rest by the end of the lift
  return .55 * ease(u / 26) + .12 * ease((b - 48) / 24) + .23 * ease((b - 72) / 16) + .1 * ease((b - 104) / 16); };
function plant(i, b, s) {
  const [H, t0, type, hr, tOpen] = PLANTS[i], g = growth(b, t0); if (g <= 0) return;
  const x0 = SUN_X + (i - 5) * LANE, h = H * g, sway = (5 + (i % 4 === s.root ? 7 * s.bass : 0)) * Math.sin(b * Math.PI / 4 + i * 1.7), bend = (hash(i, 9) - .5) * 26;
  const P = (t) => [x0 + sway * t * t + bend * Math.sin(t * Math.PI), GROUND - h * t];
  // roots: down as far as the stem is up, inside the lane
  for (let k = 0; k < 3; k++) { const a = (k - 1) * .62 + (hash(i, k, 11) - .5) * .3, len = Math.min(170, 30 + h * .3) * (.7 + .3 * hash(i, k, 12));
    p.beginPath(); p.moveTo(x0, GROUND + 3); for (let j = 1; j <= 10; j++) { const u = j / 10; p.lineTo(x0 + Math.sin(a) * len * u * .62 + Math.sin(u * 7 + i + k) * 6 * u, GROUND + 3 + Math.cos(a) * len * u); }
    p.strokeStyle = ink(.5); p.lineWidth = 3; p.lineJoin = 'round'; p.stroke(); }
  // stem
  p.beginPath(); p.moveTo(...P(0)); for (let k = 1; k <= 28; k++) p.lineTo(...P(k / 28)); p.strokeStyle = ink(.82); p.lineWidth = 5; p.lineJoin = 'round'; p.stroke();
  // leaves: one every 84 px of stem, alternating sides, none near the flower
  const bud = ease((b - t0 - 14) / 4), nLeaves = Math.floor((H - hr - 70) / 84);
  for (let k = 0; k < nLeaves; k++) { const at = 62 + k * 84; if (h < at + 12) break; const [lx, ly] = P(at / h), side = (k + i) % 2 ? 1 : -1, sz = ease((h - at - 12) / 70) * (46 + hash(i, k, 4) * 16);
    petal(lx, ly, -Math.PI / 2 + side * (.95 + .12 * Math.sin(b * Math.PI / 4 + i + k)), sz, sz * .24, .66, .24); }
  // the tip: a point that beats with the pluck, then a bud, then the flower
  const [tx, ty] = P(1), [ux, uy] = P(.94), up = Math.atan2(ty - uy, tx - ux);
  if (bud < 1) disc(tx, ty, 5 + 6 * s.pluck, .9);
  if (bud > 0) head(type, tx, ty, up, hr * bud * (.62 + .38 * ease((b - tOpen) / 9)) * (1 + .04 * s.kick), ease((b - tOpen) / 9), b * .02 + i, i);
}
const SUN_REACH = (L) => 70 + 68 * L;                                  // how far a full-scale ray reaches past the disc
function sun(b, s) {
  const sp = spectrum(b), L = s.L, r0 = 70 + 34 * L + 7 * s.kick, reach = SUN_REACH(L), on = ease(b / 2);
  // rays: 32 bands down each side, bass at the bottom, treble at the top
  for (let side = -1; side <= 1; side += 2) for (let k = 0; k < 32; k++) { const a = Math.PI / 2 + side * (k + .5) / 32 * Math.PI, len = 5 + sp[k] * reach, c = Math.cos(a), sn = Math.sin(a);
    const g = p.createLinearGradient(SUN_X + c * (r0 + 12), SUN_Y + sn * (r0 + 12), SUN_X + c * (r0 + 12 + len), SUN_Y + sn * (r0 + 12 + len)); g.addColorStop(0, ink(.85 * on)); g.addColorStop(1, ink(.3 * on));
    p.beginPath(); p.moveTo(SUN_X + c * (r0 + 12), SUN_Y + sn * (r0 + 12)); p.lineTo(SUN_X + c * (r0 + 12 + len), SUN_Y + sn * (r0 + 12 + len)); p.strokeStyle = g; p.lineWidth = 5.5; p.lineCap = 'butt'; p.stroke(); }
  // the disc: a shaded ball, darker rim; a dotted halo at the furthest the rays can reach now
  const g = p.createRadialGradient(SUN_X - r0 * .3, SUN_Y - r0 * .3, r0 * .1, SUN_X, SUN_Y, r0); g.addColorStop(0, ink(.1 * on)); g.addColorStop(.7, ink((.24 + .2 * L) * on)); g.addColorStop(1, ink(.6 * on));
  p.beginPath(); p.arc(SUN_X, SUN_Y, r0, 0, TAU); p.fillStyle = g; p.fill(); p.strokeStyle = ink(.9 * on); p.lineWidth = 3.5; p.stroke();
  p.save(); p.setLineDash([3, 15]); p.lineDashOffset = b * 6; p.beginPath(); p.arc(SUN_X, SUN_Y, r0 + 18 + reach, 0, TAU); p.strokeStyle = ink(.42 * on); p.lineWidth = 3.5; p.stroke(); p.restore();
}
// title: 5x7 dot letters
const FONT = { S: '01111100001000001110000010000111110', L: '10000100001000010000100001000011111', O: '01110100011000110001100011000101110',
  W: '10001100011000110101101011101110001', I: '11111001000010000100001000010011111', G: '01110100011000010111100011000101110',
  H: '10001100011000111111100011000110001', T: '11111001000010000100001000010000100', ' ': '0'.repeat(35) };
function title(alpha) { if (alpha <= 0) return; const T = 'SLOW LIGHT', u = 13, x0 = SUN_X - (T.length * 6 - 1) * u / 2, y0 = 560; p.fillStyle = ink(.92 * alpha);
  [...T].forEach((ch, i) => { for (let k = 0; k < 35; k++) if (FONT[ch][k] === '1') p.fillRect(x0 + (i * 6 + k % 5) * u, y0 + Math.floor(k / 5) * u, u, u); }); }

function paint(b, s) {
  p.setTransform(1, 0, 0, 1, 0, 0); p.globalAlpha = 1; p.fillStyle = '#000'; p.fillRect(0, 0, big.width, big.height); p.setTransform(big.width / 1920, 0, 0, big.height / 1080, 0, 0);
  sun(b, s);
  title(ease((b - .4) / 1.6) * (1 - ease((b - 5.5) / 2.5)));
  // the ground: one line
  const gl = ease(b / 3);
  p.beginPath(); p.moveTo(960 - (COVER ? 480 : 920) * gl, GROUND); p.lineTo(960 + (COVER ? 480 : 920) * gl, GROUND); p.strokeStyle = ink(.85); p.lineWidth = 4; p.stroke();
  for (let i = COVER ? 3 : 0; i < (COVER ? 8 : PLANTS.length); i++) plant(i, b, s);
  // the melody: each note rings from the flower whose lane matches its pitch (low notes left, high notes right)
  for (const [age, m] of COVER ? [] : s.notes) { const i = clamp(Math.round((m - 64) / 16 * 10), 0, 10), [H, t0] = PLANTS[i], f = 1 - age / .75;
    p.save(); p.setLineDash([4, 12]); p.beginPath(); p.arc(SUN_X + (i - 5) * LANE, GROUND - H * growth(b, t0), 74 + age * 26, 0, TAU); p.strokeStyle = ink(.8 * f); p.lineWidth = 3.5; p.stroke(); p.restore(); }
}

// ---------- ink: every cell becomes one glyph; density and opacity follow the painting ----------
const LEVELS = ['.,', ':;', "'`", '+*', '<>/', '{}()', '01o', 'xea', 'wm8', 'B#%@'];       // light to dark, code glyphs throughout
const atlas = document.createElement('canvas'), GL = [];
{ LEVELS.forEach((set) => [...set].forEach((ch) => GL.push(ch))); atlas.width = Math.ceil(GL.length * 10 * K); atlas.height = Math.ceil(12 * K); const a = atlas.getContext('2d'); a.scale(K, K);
  a.font = '700 8px Menlo, Consolas, "DejaVu Sans Mono", monospace'; a.textBaseline = 'middle'; a.textAlign = 'center'; a.fillStyle = INK; GL.forEach((ch, i) => a.fillText(ch, i * 10 + 5, 6)); }
const LSTART = []; { let n = 0; LEVELS.forEach((set) => { LSTART.push(n); n += set.length; }); }
const paper = document.createElement('canvas'); paper.width = 1920; paper.height = 1080;
{ const a = paper.getContext('2d'); a.fillStyle = PAPER; a.fillRect(0, 0, 1920, 1080);
  const v = a.createRadialGradient(960, 520, 300, 960, 540, 1250); v.addColorStop(0, 'rgba(255,250,238,.28)'); v.addColorStop(.6, 'rgba(120,100,70,0)'); v.addColorStop(1, 'rgba(90,72,48,.34)'); a.fillStyle = v; a.fillRect(0, 0, 1920, 1080);
  for (let i = 0; i < 26000; i++) { a.fillStyle = hash(i, 81) < .5 ? 'rgba(70,55,35,.05)' : 'rgba(255,252,244,.07)'; a.fillRect(hash(i, 82) * 1920, hash(i, 83) * 1080, 1 + hash(i, 84) * 2, 1 + hash(i, 85) * 2); } }   // paper grain

function frame(b) {
  const s = song(b); paint(b, s);
  sm.drawImage(big, 0, 0, C, R); const d = sm.getImageData(0, 0, C, R).data;
  cx.setTransform(K, 0, 0, K, 0, 0); cx.globalAlpha = 1; cx.drawImage(paper, 0, 0);
  const beatN = Math.floor(b * 4), disp = clamp((b - 139) / 12.5), fadeOut = 1 - ease((b - 151) / 1.5);
  for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) {
    let v = d[(y * C + x) * 4] / 255; if (v < .07) continue;
    const h0 = hash(x, y, 3);
    v = clamp(v + (hash(x, y, beatN + (h0 * 4 | 0)) - .5) * .07);                             // the stipple breathes, a quarter of the cells each beat
    const lv = Math.min(LEVELS.length - 1, Math.pow(v, .78) * LEVELS.length | 0), set = LEVELS[lv], gi = LSTART[lv] + (hash(x, y, (beatN + (h0 * 8 | 0)) >> 3) * set.length | 0);
    let px = x * CW - 3, py = y * CH - 3, al = (.36 + .64 * v) * fadeOut;
    if (disp > 0) { const h1 = hash(x, y, 91), h2 = hash(x, y, 92), ph = clamp((disp - .3 * h1) / .7); if (ph > 0) {      // stardust: the ink lifts off the paper (glyph-grid-studio's dispersal)
        px += (h2 - .5) * 2 * .3 * 430 * ph + Math.sin(b * 2 + h1 * TAU) * 9 * ph; py -= ph * 430 * (.4 + .6 * h2); al *= Math.pow(1 - ph, 1.6); } }
    if (al < .02) continue;
    cx.globalAlpha = al; cx.drawImage(atlas, gi * 10 * K, 0, 10 * K, 12 * K, px, py, 10, 12);
  }
  cx.globalAlpha = 1;
}

// ---------- layout check: nothing may touch anything else, at any bar (run viz.check() in the console, or tools/viz/check_layout.mjs) ----------
// Flower heads against each other, against the sun's halo and against the frame; the title against the sun and the stems under it.
function sunOuter(b) { const s = song(b); return 70 + 34 * s.L + 7 * s.kick + 18 + SUN_REACH(s.L); }
function headAt(i, b) { const s = song(b), [H, t0, type, hr, tOpen] = PLANTS[i], g = growth(b, t0), x0 = SUN_X + (i - 5) * LANE;
  const sway = (5 + (i % 4 === s.root ? 7 * s.bass : 0)) * Math.sin(b * Math.PI / 4 + i * 1.7), bud = ease((b - t0 - 14) / 4);
  const r = bud > 0 ? hr * bud * (.62 + .38 * ease((b - tOpen) / 9)) * (1 + .04 * s.kick) * (type === 2 ? 1.3 : 1.02) : g > 0 ? 11 : 0;
  return { x: x0 + sway, y: GROUND - H * g, r, g }; }
function check(step = .125) { const bad = [], say = (b, m) => { if (bad.length < 40) bad.push(`bar ${(b + 1).toFixed(2)}: ${m}`); };
  for (let b = 0; b < BARS; b += step) { const hs = PLANTS.map((_, i) => headAt(i, b)), so = sunOuter(b);
    hs.forEach((h, i) => { if (!h.r) return;
      if (Math.hypot(h.x - SUN_X, h.y - SUN_Y) < h.r + so + 6) say(b, `flower ${i} touches the sun's halo (gap ${(Math.hypot(h.x - SUN_X, h.y - SUN_Y) - h.r - so).toFixed(0)} px)`);
      if (h.y - h.r < 6 || h.x - h.r < 6 || h.x + h.r > 1914) say(b, `flower ${i} leaves the frame`);
      if (i && hs[i - 1].r && Math.hypot(h.x - hs[i - 1].x, h.y - hs[i - 1].y) < h.r + hs[i - 1].r + 6) say(b, `flowers ${i - 1} and ${i} touch`);
      if (b < 8 && Math.abs(h.x - SUN_X) < 400 + h.r && h.y - h.r < 560 + 91 + 8) say(b, `flower ${i} reaches the title`); });
    if (b < 8 && SUN_Y + so > 552) say(b, 'the sun reaches the title'); }
  return bad; }

// ---------- clocks: ?bar=N holds one frame; otherwise the master plays and the picture follows its time ----------
const params = new URLSearchParams(location.search), go = document.getElementById('go');
window.viz = { BPM, BARS, TAIL, frame, song, PLANTS, growth, check, shot: (bar, q = .93) => { frame(bar); return cv.toDataURL('image/jpeg', q); }, ready: false };
fetch('slow-light-spectrum.json').then((r) => r.json()).then((j) => { SPEC = { fps: j.fps, frames: j.frames, d: Uint8Array.from(atob(j.data), (ch) => ch.charCodeAt(0)) }; })
  .catch((e) => console.error('no spectrum file: the sun will not move', e))
  .finally(() => {
    window.viz.ready = true;
    if (params.has('bar')) { go.remove(); frame(+params.get('bar')); return; }
    frame(3);
    go.onclick = () => {
      go.remove();
      const audio = new Audio(params.get('audio') || '/renders/slow-light-master-14.mp3'); window.viz.audio = audio;
      const from = +params.get('from') || 0; let t0 = null;
      audio.addEventListener('loadedmetadata', () => { audio.currentTime = from * 240 / BPM; audio.play(); });
      audio.addEventListener('error', () => { t0 = performance.now() - from * 240 / BPM * 1000; });     // no master yet: run silent on the wall clock
      const loop = (t) => { const sec = t0 === null ? audio.currentTime : (t - t0) / 1000; frame(Math.min(sec * BPM / 240, BARS + TAIL)); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    };
  });
</script>
</body>
</html>
