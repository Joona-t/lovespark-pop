// Aura (Festival Version) · the second video. Joona: "have it build visuals and dont have it limited to the circle i want the
// full screen including glyph grid staying as well", then "make this the SOTA. Highly complex & intricate beyond what any human can do".
// A glyph shader: the frame is a fixed grid of 320 x 120 glyph cells, and every cell of every frame is computed from the bar
// position and the master's spectrum (a pure function: no state, no Math.random). Where the figure is thin the lovespark.love
// vertical hatching shows through, so the glyph grid never leaves the screen.
//   air, bloom, pulse   standing waves of a rectangular plate, full frame; every bell note ripples out from its pitch's place
//   groove              a quasicrystal: as many plane waves as the chord has spokes, drifting against each other
//   breakdown           aurora: curtains of glyph light (three, then five when the second arp joins)
//   build               a tunnel that accelerates and gains a ring per bar; bar 64 lies flat under one thrown stab
//   drop 1              wave sources interfering: the kick at the centre, two in orbit, and a new one for every vocal stab
//   breakdown II        a de Jong strange attractor, 260,000 points a frame, its four parameters drifting
//   drop 2              a kaleidoscopic Julia set folded to the chord's symmetry; the 303 line steers its constant
//   peak                the Julia set and the quasicrystal together, the bell an octave up ringing white over both
//   outro, ring-out     the quasicrystal calms, the aurora returns and thins, the hatching is the last thing left

const DOT = GLY.length; GLY.push('·', '•', '●');
const HAT = GLY.length; HRAMP.forEach((ch) => GLY.push(ch));

  // the build: a tunnel, faster every bar

    f(i, S) { const r = R[i] + .02, lr = Math.log(r), f = Math.cos(S.tk * lr - S.tph) * Math.cos(S.m * (A[i] + S.tw * lr) + S.rot);

  // drop 2: the Julia set of z^2 + c, folded into the chord's symmetry; c walks a circle and the 303 line kicks it along

  peak: { prep(S, s) { S.acid = .7; S.jh0 = 2; S.jh1 = 2.4; S.jsharp = 13; S.jfloor = .26; prepJulia(S, s); S.hue = 2; prepQuasi(S, 7); },

const SCENE_OF = { air: 'plate', bloom: 'plate', pulse: 'plate', groove: 'quasi', breakdown: 'aurora', build: 'tunnel', drop1: 'waves', breakdown2: 'attractor', drop2: 'julia', peak: 'peak', ringout: 'aurora' };
const sceneAt = (b) => SCENES[b >= 112 && b < 136 ? (b < 120 ? 'quasi' : 'aurora') : SCENE_OF[sec(b)[2]]];
const HATCH_HUE = { breakdown: .6, drop2: 4.6, peak: 3, breakdown2: 2.3 };

const titleAlpha = (b) => ease(b / 1.5) * (1 - ease((b - 6) / 2));
const S = {};
function frame(b) {
  const s = song(b), spec = spectrum(b), still = silent(b), cs = cells(b), name = sec(b)[2], scene = sceneAt(b);
  const t = b * 240 / BPM; let E = 0; for (let q = 0; q < 32; q++) E += spec[q]; E /= 32;
  const fadeFig = 1 - ease((b - 133.5) / 2.5), fadeAll = (1 - .85 * ease((b - 136.6) / 1.4)) * (b < 1 ? .25 + .75 * ease(b) : 1), ta = titleAlpha(b);
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.globalAlpha = 1; cx.fillStyle = BG; cx.fillRect(0, 0, SW, SH);
  S.b = b; S.t = t; S.E = E; S.L = s.L; S.sharp = 1.6 + 2.6 * s.L; S.n = rings(b); S.m = SPOKES[s.ci]; S.hue = 1 + s.warm;
  if (!still) scene.prep(S, s);
  // the cells of this transition: which lattice, which order of booms (the dissolve already wears the next chord's lattice)
  const chord = Math.floor(b / 2), ti = cs.p >= 6.5 ? chord + 1 : chord, lat = LATS[Math.floor(hash(ti, 71) * LATS.length)], grp = lat.grp[Math.floor(hash(ti, 72) * 4)], CC = lat.cc, p = cs.p;
  for (let q = 0; q < lat.n; q++) { const g = grp[q]; CC[q] = still ? 0 : p < 3 ? (p < g ? 1 : 1 - ease((p - g) / .15)) : p >= 6.5 ? ease((p - 6.6 - .6 * lat.h[q]) / .3) : 0; }
  // the hatching underneath: drifts with the music's energy, sways, and rings run out from the centre on kicks and booms
  const ft = fieldTime(b), fa = (.27 + .13 * s.kick + .14 * s.drop + .05 * s.roll + .08 * s.chop + .06 * cs.bm + .09 * s.stab) * (b < 4 ? .4 + .6 * ease(b / 4) : 1) * fadeAll;
  const kAge = fr(b * 4), kStr = still ? 0 : kickOn(b) * (1 - kAge) * .5 * Math.min(1, kAge * 12), kR = .08 + 2.1 * kAge, bAge = fr(p), bStr = still || p >= 3 ? 0 : cs.bm * .9 * (1 - bAge), bR = .08 + 2.3 * bAge;
  const sway = still ? 0 : 1.5 + 5 * E, hrow = Math.round((HATCH_HUE[name] ?? 2) * HSTEP);
  const jmag = still ? 0 : 5 * s.kick + 9 * cs.bm + 14 * s.drop + 4 * s.chop + 3 * s.stab + 3 * s.roll * (1 + Math.sin(b * TAU * 8) * .5), push = still ? 0 : 12 * cs.bm + 8 * s.stab;
  const beat16 = Math.floor(b * 16), gsh = kickOn(b) ? 0 : 2, notes = s.notes, nn = notes.length, mem0 = .64, stabUp = 1 + .7 * s.stab + .5 * s.drop;
  // each bell note's place: pitch across the frame, a slow wave up and down
  const NX = [], NY = []; for (let q = 0; q < nn; q++) { NX.push((notes[q][1] - 74) / 9 * 1.35 * (notes[q][1] > 84 ? .6 : 1)); NY.push(.55 * Math.sin(notes[q][1] * 2.1)); }
  let nfig = 0, nhatch = 0, tInk = 0; const tfull = ease(ta * 1.7);   // the title's ground clears before the title is fully up
  for (let i = 0; i < NCELL; i++) {
    const q = lat.cell[i], cc = CC[q]; let k = 0, hue = S.hue, dot = -1;
    if (still) k = FLATK[i];
    else {
      if (cc < 1 && H7[i] <= s.amt) { k = scene.f(i, S) * fadeFig * stabUp; if (k > 1) k = 1; hue = HUE + .8 * s.stab; }
      if (cc > 0) { const dn = lat.dn[i], mem = mem0 + .07 * Math.sin(t * 4 + lat.ph[q]) - .1 * s.chop; let kc = 0, part = 0;
        if (dn < .22) { kc = .95; part = 2; } else if (Math.abs(dn - mem) < .075) { kc = .78; part = 1; } else if (H61[i] < .2) kc = .3;
        k += (kc * fadeFig - k) * cc; if (cc > .5) dot = kc > 0 ? part : -2; }
    }
    for (let n = 0; n < nn; n++) { const age = notes[n][0], d = Math.abs(Math.hypot(U[i] - NX[n], V[i] - NY[n]) - age * .75), w = .028 + .012 * (notes[n][1] % 3);
      if (d < w) { const kr = (1 - d / w) * (1 - age / 2) * .85 * notes[n][2]; if (kr > k) { k = kr; hue = 3; dot = -1; } } }

      const lv = Math.min(SRAMP.length - 1, Math.pow(k, .8) * SRAMP.length | 0), set = SRAMP[lv];
      const gi = dot >= 0 ? DOT + dot : SSTART[lv] + (hash(i, still ? 0 : beat16 >> gsh) * set.length | 0);

      const d = R[i], ring = kStr * Math.exp(-(((d - kR) / .07) ** 2)) + bStr * Math.exp(-(((d - bR) / .09) ** 2));

      if (HSKIP[i]) continue;

      const al = Math.min(1, fa * (1 + 1.6 * ring)) * tsup; cx.globalAlpha = al; cx.drawImage(atlas, (HAT + g) * TW, hrow * TH, TW, TH, px - 5, py - 6, TW, TH);

  if (ta > 0) { cx.globalAlpha = ta * .9; cx.fillStyle = '#e6d6ad'; cx.textBaseline = 'alphabetic'; cx.textAlign = 'left';
    cx.font = '700 56px ui-monospace, "SF Mono", Menlo, monospace'; cx.fillText('A U R A', TITLE.x, TITLE.y);
    cx.globalAlpha = ta * .6; cx.font = '400 22px ui-monospace, "SF Mono", Menlo, monospace'; cx.fillText('Bvby Ash', TITLE.x + 4, TITLE.y + 40); }

}

// ---------- layout check: run viz.check() in the console, or tools/viz/check_layout.mjs aura-festival ----------
// Every quarter bar the page draws the frame and counts what actually landed on the canvas: the figure must be there (not an
// empty frame, the defect the album cover's first render had) and must not fill the frame solid; the glyph grid must stay on
// screen to the end; and while the title shows, no glyph may be painted under it.
function check(step = 1 / 4) { const bad = [], say = (b, m) => { if (bad.length < 40) bad.push(`bar ${(b + 1).toFixed(2)}: ${m}`); };
  if (TITLE.x < 8 || TITLE.y + 44 > SH - 8) say(0, 'the title leaves the frame');
  for (let b = 0; b < BARS; b += step) { frame(b); const st = window.viz.stats, pct = (v) => (v * 100).toFixed(1) + '%';
    if (b >= 1 && b < 130 && !silent(b) && st.fig < .012) say(b, `the figure is missing (${pct(st.fig)} of the grid lit)`);
    if (st.fig > .62) say(b, `the figure fills the frame solid (${pct(st.fig)})`);
    if (b >= 1 && b < 137 && st.fig + st.hatch < .06) say(b, `the glyph grid has left the screen (${pct(st.fig + st.hatch)} drawn)`);
    if (st.ta > .6 && st.titleInk > .2) say(b, `glyphs are painted under the title (alpha ${st.titleInk.toFixed(2)})`); }
  return bad; }

// ---------- clocks: ?bar=N holds one frame; otherwise the master plays and the picture follows its time ----------
const go = document.getElementById('go');
window.viz = { BPM, BARS, TAIL, frame, song, cells, check, stats: null, shot: (bar, q = .93) => { frame(bar); return cv.toDataURL('image/jpeg', q); }, ready: false };
fetch('aura-festival-spectrum.json').then((r) => r.json()).then((j) => {
    SPEC = { fps: j.fps, frames: j.frames, d: Uint8Array.from(atob(j.data), (ch) => ch.charCodeAt(0)) };
    CUM = new Float32Array(SPEC.frames); for (let i = 1; i < SPEC.frames; i++) { const b = (i / SPEC.fps - OFF) * BPM / 240;
      CUM[i] = CUM[i - 1] + (silent(b) ? 0 : (.8 + 4.5 * energy(i)) / SPEC.fps); } })
  .catch((e) => console.error('no spectrum file: the field will not follow the music', e))
  .finally(() => {
    window.viz.ready = true;
    if (QS.has('bar')) { go.remove(); frame(+QS.get('bar')); return; }
    frame(30);
    go.onclick = () => {
      go.remove();
      const audio = new Audio(QS.get('audio') || '/renders/aura-festival-r1-master.mp3'); window.viz.audio = audio;
      const from = +QS.get('from') || 0; let t0 = null;
      audio.addEventListener('loadedmetadata', () => { audio.currentTime = from * 240 / BPM + OFF; audio.play(); });
      audio.addEventListener('error', () => { t0 = performance.now() - from * 240 / BPM * 1000; });
      const loop = (t) => { const sx = t0 === null ? audio.currentTime - OFF : (t - t0) / 1000; frame(Math.min(sx * BPM / 240, BARS - .001)); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    };
  });
</script>
